<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>--more-- · rogue family trivia</title>
<meta name="description" content="465 tidbits of lore from Rogue, Advanced Rogue, Super-Rogue, XRogue, UltraRogue and MAG: flavour text, unique items and monsters, mechanics oddities and combat details, checked against the source code.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a0d;--stone:#17151a;--line:#2e2a33;--text:#d9d4c7;--dim:#8d8676;--gold:#e0b24f;--ember:#ff7a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Mono',ui-monospace,monospace}
a{color:var(--gold)}
header{padding:28px 18px 8px;max-width:1200px;margin:0 auto}
h1{font:800 clamp(26px,5vw,42px) Cinzel,serif;color:var(--gold);margin:0;letter-spacing:.04em}
h1 small{color:var(--ember);font-size:.5em;display:block;letter-spacing:.2em;margin-bottom:4px}
.sub{color:var(--dim);max-width:760px;margin:10px 0 0}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:12px 18px 14px;max-width:1200px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tab{font:600 15px Cinzel,serif;letter-spacing:.06em;background:var(--stone);color:var(--dim);border:1px solid var(--line);padding:8px 16px;cursor:pointer;border-radius:4px}
.tab[aria-selected=true]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
input[type=search],select{background:var(--stone);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:inherit}
input[type=search]{flex:1;min-width:180px}
input:focus,select:focus,.tab:focus-visible,button:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
.count{color:var(--dim);margin-left:auto}
nav.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav.cats a{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:2px 8px;border-radius:99px}
nav.cats a:hover{color:var(--gold);border-color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:0 18px 60px}
section{margin-top:28px}
h2{font:600 22px Cinzel,serif;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
h2 span{font:400 12px 'IBM Plex Mono';color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{background:var(--stone);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:4px;padding:10px 12px}
.card h3{margin:0;font:600 15px 'IBM Plex Mono';color:var(--text);display:flex;justify-content:space-between;gap:8px}
.card h3 b{color:var(--ember);font-weight:600;white-space:nowrap}
.card p{margin:4px 0;color:var(--dim)}
.card .var{font-size:12px;color:#a59d89}
.card .var i{color:var(--gold);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font:12px 'IBM Plex Mono';background:#201d25;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:1px 6px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.refs{display:none;margin-top:8px;font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:6px;word-break:break-all}
.card.open .refs{display:block}
.refs div b{color:var(--gold);font-weight:600}
.more{background:none;border:0;color:var(--dim);cursor:pointer;font:12px inherit;padding:6px 0 0;text-decoration:underline}
.empty{color:var(--dim);padding:40px 0;text-align:center}
.ctl button{font:inherit}
footer{max-width:1200px;margin:0 auto;padding:0 18px 40px;color:var(--dim);font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.count{margin-left:0}}
</style>
<style>.card{border-left-color:var(--gold)}.card h3{display:block}.card h3 b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.card{min-width:0}.card p{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}.src{font-size:11px;color:var(--dim);word-break:break-all}.src a{color:var(--dim)}</style>
</head><body>
<header><a href="../">&larr; all games</a><h1><small>--more--</small>Rogue family trivia</h1>
<p class="sub">Lore from Rogue 3.6/5.4/PC, Advanced Rogue, Super-Rogue, XRogue, UltraRogue and MAG. Mostly read straight out of the source code; every entry names where it came from. Line numbers are sometimes approximate.</p></header>
<div class="bar"><div class="row" id="tabs"></div>
<div class="row" style="margin-top:10px"><input type="search" id="q" placeholder="search…" aria-label="Search"><select id="gs" aria-label="Game"></select><span class="count" id="cnt"></span></div></div>
<main id="out"></main>
<script>
const D=[{"game": "Advanced Rogue 7.7", "category": "flavour", "title": "The quest", "text": "The game opens with a random quest: \"You have been quested to retrieve the %s....\" with one of 16 artifacts picked by rnd(MAXRELIC). You win only by climbing the stairs from level 1 while carrying that exact artifact.", "source": "arogue7.7/main.c:378-381; arogue7.7/command.c:1000-1004"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Level 0 is a market", "text": "The game starts in a trading post; trying to go up from it prints \"The stairway only goes down.\" Leaving the dungeon with the quest item shows a block-letter \"You have made it\" banner and \"Congratulations, you have made it to the light of day!\"", "source": "arogue7.7/command.c:993; arogue7.7/rip.c:773-796"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Guild of your own", "text": "Winners \"journey home and sell all your loot at a great profit\" and become head of a class-specific institution: magic user's guild, fighter's guild, ranger's guild, thief's guild, assassin's guild, or a monastery for cleric, paladin, monk and druid.", "source": "arogue7.7/rip.c:795-808"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Class title ladders", "text": "Titles run from Fighter \"Veteran\" to \"Lord\", Magic User \"Prestidigitator\" to \"Wizard I-VI\" and \"High Wizard\", Thief \"Rogue\" to \"Master Thief\", Assassin \"Bravo\" to \"Grandfather Assassin\", Cleric \"Acolyte\" to \"High Priest\".", "source": "arogue7.7/rogue.c:532-613"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Monk and Druid titles", "text": "Druid titles climb \"Initiate 1st Circle\" through \"9th Circle\" to \"Druid\", \"Archdruid\", \"The Great Druid\". Monks go \"Novice\" ... \"Master of Dragons\", then Masters of the North, West, South, East Wind, then Winter, Autumn, Summer, Spring, finally \"Grand Master\".", "source": "arogue7.7/rogue.c:603-621"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Ranger and paladin titles", "text": "Rangers are \"Runner\", \"Strider\", \"Scout\", \"Courser\", \"Tracker\", \"Guide\", \"Pathfinder\", \"Ranger\", \"Ranger Knight\", \"Ranger Lord\". Paladins are \"Gallant\", \"Keeper\", \"Protector\", \"Defender\", \"Warder\", \"Guardian\", \"Chevalier\", \"Justiciar\", \"Paladin\".", "source": "arogue7.7/rogue.c:540-560"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Fruit salad", "text": "Besides the food ration, 20 fruits exist (apple, banana, candleberry, caprifig, elderberry, guanabana, jaboticaba, pitanga, rambutan, sapodilla, soursop, sweetsop, whortleberry...). Each is 300 food, and several have secret effects.", "source": "arogue7.7/rogue.c:412-436"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Eating messages", "text": "After a meal you get one of \"My, that was a yummy %s\", \"Mmmm, that was a tasty %s\" or \"Wow, that was a scrumptious %s\". If stuffed: \"You have trouble getting all that food down. Your stomach feels like its about to burst!\"", "source": "arogue7.7/eat.c:58-67"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Berries with benefits", "text": "Whortleberry +1 Int, sweetsop +1 Dex, soursop +1 Str, sapodilla +1 Wis, rambutan +1 Con, peach +1 Cha, strawberry +1% experience, pitanga +1 max HP (\"You feel a bit tougher now. Go get 'em!\"), hagberry -1 armor class (\"Your skin feels more resilient now\").", "source": "arogue7.7/eat.c:70-108"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Dewberry", "text": "Eating a dewberry lowers your spell, prayer and chant penalty counters by 50 each: \"You feel you have more spell casting ability\", \"...prayer ability\", \"...chant ability\".", "source": "arogue7.7/eat.c:109-126"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Artifact descriptions", "text": "Unidentified artifacts have look-alike names: \"Two very fine daggers marked MDDE\" (Musty Doit), \"A silk cloak\", \"A golden ankh\", \"A finely carved staff\", \"A sparkling ivory wand\", \"A glistening ebony rod\", \"A silver amulet\" (Yendor), \"A stone amulet\", \"A gleaming mandolin\", \"A huge morning star\", \"A jewel encrusted axe\", \"A bright white feather\", \"A jet black horn\", \"A shimmering flail\", \"A fiery red ring\".", "source": "arogue7.7/things.c:174-203"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Worn artifacts", "text": "Inventory suffixes for artifacts: \"(in hand)\" for the ankh, \"(in eye socket)\" for Vecna's eye, \"(in chest)\" for the amulets, \"(in nose)\" for Surtur's ring, \"(weapon in hand)\", and the cloak of Emori shows \"[charged]\" or \"[discharged]\".", "source": "arogue7.7/things.c:208-239"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Disrupted actions", "text": "Getting hit during an action interrupts it: \"Your spell was disrupted!\", \"You gag on your food for a moment.\", \"You drop what you are picking up!\", \"Oww....You decide to stop searching.\", \"Oww....You can't get a trap set.\"", "source": "arogue7.7/actions.c:69-105"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Counting gold goes wrong", "text": "The * command (count gold) takes time; if interrupted, \"Your gold goes flying everywhere!\" and your purse scatters on the floor in random piles until the dice stop (1 in 10 chance to stop each pile).", "source": "arogue7.7/actions.c:80-92"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Reading scare monster", "text": "Reading a scare monster scroll (instead of dropping it) gives only \"You hear maniacal laughter in the distance.\"", "source": "arogue7.7/scrolls.c:423-428"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Cursed remove curse", "text": "A cursed scroll of remove curse curses your pack: \"The smell of fire and brimstone fills the air.\" (blessed items lose the blessing; others become cursed).", "source": "arogue7.7/scrolls.c:429-441"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Scroll of runes", "text": "Reading runes: \"The scroll explodes in a ball of fire!\", damages you and each scroll in your pack burns up (\"%s burns up!\") on a roll(1,20) below 19, i.e. 90% each. Fire resistance negates it.", "source": "arogue7.7/scrolls.c:699-724"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Charm monster", "text": "On a charmed ambusher you get \"Woah!\" followed by \"The eyes of %s glaze over!\". Charisma and paladin/ranger class (against non-mean monsters) improve your odds. A charmed monster that is hit may later get \"The eyes of %s turn clear.\"", "source": "arogue7.7/scrolls.c:770-790; arogue7.7/fight.c:185-190"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Merchant behaviour", "text": "Wandering quartermasters announce \"%s opens his pack.--More--\", or leave with \"eyes your small purse and departs\" if you cannot afford their cheapest item, or \"looks puzzled and departs\" if empty. Hit one and \"%s disappears with his wares in a flash.\"", "source": "arogue7.7/monsters.c:476-503; arogue7.7/fight.c:190-195"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Dust of choking", "text": "Dust of choking: \"aaAAACHOOOooo. Cough. Cough. Sneeze. Sneeze.\" then, unless you save versus poison, \"You choke to death!!!\". Wearing the Ring of Surtur grants immunity.", "source": "arogue7.7/misc.c:1040-1046"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Piercing shriek", "text": "Hitting a shrieker triggers \"%s emits a piercing shriek.\" (or \"You hear a piercing shriek.\"), which aggravates every mean monster on the level, uniques included.", "source": "arogue7.7/effects.c:80-88"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Instadeath messages", "text": "Eating when satiated can kill: \"You choke on all that food and die!\" (a 1 in 4 chance when already full). Death types include \"an artifact's wrath\", \"dust of choking\", \"strangulation\", \"a bug\", \"body rot\", \"poor health\", \"being too weak\", \"reading a scroll\".", "source": "arogue7.7/eat.c:48-54; arogue7.7/rogue.c:192-212"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Mimic and ambush text", "text": "Disguised monsters reveal themselves with \"Wait! That's a %s!\"; surprise attackers with \"Wait! There's a %s!\" (not if you wear a ring of alertness).", "source": "arogue7.7/fight.c:110-127"}, {"game": "Advanced Rogue 7.7", "category": "flavour", "title": "Otto's dance", "text": "Enemies with CANDANCE (\"Otto's irresistible dance\" in the source comment) make you \"begin to dance uncontrollably!\" for 2d4 turns; dancing doubles your movement delay. In the monster table Emori, Yendor and Vecna carry the CANDANCE flag.", "source": "arogue7.7/effects.c:473-483; arogue7.7/move.c:1426"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Sixteen artifacts", "text": "7.7 has 16 artifacts (Musty Doit's daggers, Emori's cloak, Heil's ankh, Ming's staff, Orcus' wand, Asmodeus' rod, Yendor's amulet, Brian's mandolin, Geryon's horn, Hruggek's morning star, Yeenoghu's flail, Vecna's eye, Aklad's axe, Nagrom's quill, Stonebones' amulet, Surtur's ring). 5.8 has only the first 11.", "source": "arogue7.7/rogue.c:394-410; arogue5.8/rogue.c:327-339; arogue5.8/rogue.h:722"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Artifacts are owner-only", "text": "Artifacts have probability 0 in random generation; they appear only in the pack of their unique owner and are dropped when he dies. Uniques in the monster table with an artifact flag: CARRYMDAGGER, CARRYCLOAK, CARRYANKH ... CARRYSURTURRING.", "source": "arogue7.7/rogue.h:563-594; arogue7.7/pack.c:1100-1225"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Daggers of Musty Doit", "text": "Picking them up wields them, starts a fuse that turns you into a thief within roll(20,20) turns, and starts a gold-eating daemon: \"Your purse feels lighter\" and \"%s demand you find more gold\". With an empty purse they cost 1 hit point per tick. Hit bonus +6/+6 (needs Str and Dex above 15, else -3/-3), 1d4+1 twice per swing, and one extra backstab multiplier.", "source": "arogue7.7/pack.c:315-331; arogue7.7/daemons.c:619-626; arogue7.7/fight.c:422-446"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Axe of Aklad", "text": "Wield-locked; turns you into a fighter after roll(20,20) turns. +5/+5, 3d6 melee (1d6 thrown) plus drain: target loses 1d8 hp and a level (\"The artifact cackles with laughter\"). Monsters always prefer it as a weapon if they find it.", "source": "arogue7.7/fight.c:366,456-458,596-604; arogue7.7/pack.c:322-330; arogue7.7/chase.c:832-837"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Flail of Yeenoghu", "text": "Does 3d6 with +3/+3, and each hit may paralyze (\"The artifact hums happily.\") and confuse (\"The artifact warms with pleasure.\"), saves vs magic apply.", "source": "arogue7.7/fight.c:361,449-451,520-570"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Morning Star of Hruggek", "text": "Plain 3d10 with +3/+3, always wield-locked when picked up. It is the biggest pure melee die among the artifacts.", "source": "arogue7.7/fight.c:362,449-451"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Wand of Orcus", "text": "Weapon damage is \"destroy\": the target is slain unless it saves vs magic at -4, and you heal half of its hit points (\"The artifact draws energy.\"). Against a player: \"You feel a tug at your life force.\" and on a failed save \"The wand devours your soul.\"", "source": "arogue7.7/fight.c:365,572-593"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Rod of Asmodeus", "text": "Melee 2d8+1. Monsters carrying it fire a random \"lightning bolt\", \"flame\" or \"ice\" bolt of roll(level,6) damage, and each use halves their chance of using the rod again.", "source": "arogue7.7/fight.c:364; arogue7.7/misc.c:166-182"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Staff of Ming", "text": "Melee 1d8 with +2/+2. A monster holding it shoots missiles of (monster level)d4 and gets 4/5 of its usage chance back each time. The wand version of magic missile does 6d4, a staff 10d4, a relic 15d4.", "source": "arogue7.7/fight.c:363; arogue7.7/misc.c:149-160; arogue7.7/sticks.c:309-316"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Cloak of Emori", "text": "Forces you to remove armor (\"The cloak insists you remove your current garments\"); if you cannot, \"The cloak constricts around you. It draws your life force from you!!!\" and you die. Gives -5 armor class, acts as a cloak of displacement (first attack on you misses: \"%s looks amazed\"), and a monster holding it charged can zap you with paralysis.", "source": "arogue7.7/pack.c:260-272; arogue7.7/util.c:58-59; arogue7.7/fight.c:398-410"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Ankh of Heil", "text": "Picking it up: \"The ankh welds itself into your hand.\" Gives double prayer ability, +3 prayers, lets any class turn undead, and every normal damage roll becomes the maximum (ndice * nsides).", "source": "arogue7.7/pack.c:254-258; arogue7.7/player.c:44,384-394; arogue7.7/fight.c:605-608"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Eye of Vecna", "text": "The eye \"forces you to jam it into your eye socket!\" costing 75 hp (35 when used). It then drains 1 hp every turn, but any awake monster that sees you must save vs petrification at -2 or be \"turned to stone!\" (only one save per monster).", "source": "arogue7.7/pack.c:296-306; arogue7.7/command.c:530-534; arogue7.7/monsters.c:625-640; arogue7.7/misc.c:1147-1155"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Ring of Surtur", "text": "Picking it up: \"The ring forces itself through your nose!\" (-22 hp, then permanent fire resistance, \"The pain slowly subsides.\"). It detects food on every new level, makes you immune to dust of choking, and panics fire giants when used (\"Your nose tickles a bit.\").", "source": "arogue7.7/pack.c:343-352; arogue7.7/new_level.c:439; arogue7.7/misc.c:925-927,1159-1162"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Amulet of Skoraeus Stonebones", "text": "Welds into your chest; missile attacks are absorbed (\"Your amulet seems to absorb the magic missile\"), and the god who carries it is immune to magic missiles (\"The magic missile has no affect on %s\"). If you already hold the other artifact amulet the pickup kills you (\"It fades away....\").", "source": "arogue7.7/pack.c:276-296; arogue7.7/fight.c:271-274,666-672"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Amulet of Yendor", "text": "Only 1 in 16 quests. It is carried by \"ruler of greater titans (Yendor)\", who summons 15 titans, flies, passes through walls and can make you dance. Once worn it occupies your single amulet slot.", "source": "arogue7.7/rogue.c:1661-1670; arogue7.7/pack.c:276-296"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Quill of Nagrom", "text": "Lets you write scrolls from a list of 13, from gold detection (4 charges) through identify, light, remove curse, magic mapping, sleep, teleportation, monster confusion, cure disease, hold monster, protection, scare monster to enchantment (130). It recharges every 4 turns for a magic user, 8 for everyone else.", "source": "arogue7.7/rogue.c:496-509; arogue7.7/daemons.c:534-558; arogue7.7/pack.c:331-333"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Mandolin of Brian", "text": "Used by the player it casts hold monster (\"put monsters around us to sleep\"). The poet who owns it plays \"Some beautiful music enthralls you.\" (freeze) or you \"wince at a sour note.\" on a save.", "source": "arogue7.7/misc.c:911-912,183-198"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Horn of Geryon", "text": "You blow it to panic nearby monsters (\"The horn blasts a shrill tone.\"). Geryon uses it on you: \"A shrill blast terrifies you.\" or \"...sends chills up your spine.\" if you save or are heroic.", "source": "arogue7.7/misc.c:914-917,199-215"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Relics eat your food", "text": "Documented in the manual: artifacts are \"intelligent\", reject mishandling, and each carried artifact adds one to your hunger rate every turn.", "source": "arogue7.7/arogue77.doc:912-926; arogue7.7/daemons.c:332-335"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Unique monster cast", "text": "Uniques include Musty Doit, Jubilex, Geryon, Dispater, Yeenoghu, Emori, Heil (\"cleric of Thoth\"), Tsoming Zen, Brian (\"poet\"), Hruggek, Kurtulmak, Vaprak \"The Destroyer\", Aklad, Nagrom, Bahamut, Baalzebul, Tiamat, Orcus, Asmodeus, Demogorgon, Maglubiyet, Gruumsh, Thrym, Surtur, Skoraeus Stonebones, Yendor, Vecna.", "source": "arogue7.7/rogue.c:1435-1681"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Strongest monster", "text": "Vecna (\"the creator of liches\") is the toughest: level 47, 0d8+450 hp, 350000 exp, armor -8, 6d10 twice, invisible, wall-walking, half damage, has stone-gaze, slow and blind abilities. Yendor is just below (level 45, 400 hp).", "source": "arogue7.7/rogue.c:1661-1681"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Absurd damage values", "text": "Musty Doit hits for \"6d4+70/6d4+70\", Brian for \"8d8+48/4d4+36\", Aklad \"2d8+23/2d8+23/1d6+19/1d6+19\", Tiamat has six attacks \"2d8/3d6/2d10/3d8/3d10/1d6\".", "source": "arogue7.7/rogue.c:1435-1444,1510-1518,1543-1551,1582-1591"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Summoners", "text": "Gods summon named minions: Jubilex 4 black puddings, Geryon 5 ice devils, Yeenoghu 5 liches, Hruggek 6 purple worms, Bahamut 4 ancient gold dragons, Tiamat 6 ancient red dragons, Yendor 15 titans, Vecna 15 liches.", "source": "arogue7.7/rogue.c:1445-1681"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Uniques are never killed by traps", "text": "The code skips trap-fall damage for ISUNIQUE monsters, \"since it might have an artifact that we need\".", "source": "arogue7.7/move.c:98-104"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Ring list highlights", "text": "Rings include \"vampiric regeneration\" (1000 gp, rare), \"free action\", \"teleport control\", \"heroism\", \"fear\", \"delusion\", \"aggravate monster\", \"carrying\", \"illumination\" and \"warmth\".", "source": "arogue7.7/rogue.c:305-338"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Strange miscellaneous magic", "text": "Includes chime of hunger, jewel of attacks (acts as aggravate), robe of powerlessness, gauntlets of fumbling, necklace of strangulation, boots of dancing, book of skills, keoghtoms ointment, drums of panic, alchemy jug.", "source": "arogue7.7/rogue.c:362-391"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Book of skills", "text": "Reading it either raises your level by one (if its class is yours) or converts you to its class (\"You feel like a whole new person!\"), costing 10% of your experience.", "source": "arogue7.7/misc.c:40-60,1075-1082"}, {"game": "Advanced Rogue 7.7", "category": "unique", "title": "Wizard help screen", "text": "Wizard mode commands include ^C \"move to another dungeon level\" (100+ = trading post, 200+ = maze), ^H \"jump 9 experience levels\", ^I \"inventory of level\", and \"M make object\".", "source": "arogue7.7/rogue.c:380-393; arogue7.7/command.c:420-445"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Credits", "text": "Version string \"7.7 (Bell Labs) 07/07/86\", release 7.7.1, copyright 1984-1986 Michael Morgan, Ken Dalka and AT&T (note: Dalka, not Tom). Based on Toy, Arnold and Wichman. 5.8 is dated \"1/03/85\", release 5.8.2.", "source": "arogue7.7/vers.c:3-24; arogue5.8/vers.c"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Not Rogue Plus", "text": "Sources say 7.7 grew from Rogue 3.6 with additions from Super-Rogue and was distributed through the AT&T Toolchest. Wikipedia ties A.I. Design (Toy, Wichman, Jon Lane) to commercial ports of the original Rogue, and neither it nor the other pages checked mention Advanced Rogue in that context, so the Rogue Plus link is unverified.", "source": "https://www.roguebasin.com/index.php/Advanced_Rogue; https://rlgallery.org/about/arogue7.html; https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Release history", "text": "Per RLGallery: 7.7 was released July 1986 (\"the last surviving version of Advanced Rogue, though there are some references to a version 7.8\"); restored by the Roguelike Restoration Project in 2006.", "source": "https://rlgallery.org/about/arogue7.html"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "5.8 had four classes", "text": "5.8 has just fighter, magician, cleric and thief with 11 artifacts; 7.7 adds ranger, paladin, druid, monk and assassin plus 5 more artifacts.", "source": "arogue5.8/rogue.c:388-402; arogue5.8/HANDOVER.md; arogue7.7/rogue.c:155-166"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "72 points, charisma last", "text": "You distribute 72 attribute points; Charisma gets whatever is left over (capped at 18), so it is the dump stat in character creation.", "source": "arogue7.7/rogue.h:54; arogue7.7/init.c:520-523; arogue7.7/arogue77.doc:262-270"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Starting gold", "text": "Everyone starts with 2700 gold; fighters get +1800, thieves and assassins +600.", "source": "arogue7.7/init.c:323-331"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Charisma and shopping", "text": "You may buy only charisma/3 items per trading post visit; then \"The market is closed. The stairs are that-a-way.\" Prices are scaled by 17/charisma, with a floor of 25 base worth.", "source": "arogue7.7/rogue.h:76; arogue7.7/trader.c:398-402,432-437"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Dangling else (monk)", "text": "In roll_em the line 'if (player.t_ctype == C_MONK) if (weap == NULL) hplus += lvl/5; else hplus += str_plus+dext_plus' binds the else to the inner if: monks with a weapon get strength/dex to-hit, and every other class gets none.", "source": "arogue7.7/fight.c:518-522"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Wrong array in changeclass", "text": "changeclass starts prayer_recovery with '!cur_misc[HEIL_ANKH]' instead of cur_relic (the extinguish path above it uses cur_relic), indexing the wrong array.", "source": "arogue7.7/misc.c:76,85"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Missing wand null check", "text": "WS_MISSILE does 'if (!obj) dice = level;' and then dereferences obj anyway.", "source": "arogue7.7/sticks.c:303-316"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Paladin guilt is cumulative", "text": "Killing a non-mean monster as a paladin or ranger lowers your experience by its value and rolls under a global counter 'chance++' that never resets; once it passes you become a fighter, else \"You feel uneasy for a moment\".", "source": "arogue7.7/fight.c:1030,1077-1086"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Map symbols", "text": "The 7.7 manual shows stairs as %, a trading post entrance as ^ and an artifact as ,.", "source": "arogue7.7/arogue77.doc:350-364"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Quest has no Amulet requirement", "text": "Despite the Rogue tradition, the Amulet of Yendor is only one of 16 possible quest items (rnd(MAXRELIC)).", "source": "arogue7.7/main.c:378"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Outside level", "text": "Climbing out of level 1 without winning takes you outside: \"You emerge into the light\" or \"...night\". Daytime vision radius is 36, lit rooms at night 9, otherwise 3, and the map edge is called \"boundary of sector\".", "source": "arogue7.7/command.c:1018-1025; arogue7.7/util.c:73-92; arogue7.7/command.c:880"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Gold guarding", "text": "Greedy monsters awake but idle run to gold in their room and add 2*GOLDCALC to the pile, \"worth protecting\".", "source": "arogue7.7/monsters.c:578-600"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Ear seekers", "text": "The ear seeker has 1d1 hp, can infest, comes in droves (AREMANY) and surprises; the gas spore explodes (\"%s explodes!\") when hit.", "source": "arogue7.7/rogue.c:818-831,839-845"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "To-hit formula", "text": "swing(): roll rnd(20)+1 plus bonuses must be >= need, where need = class base - factor * ((min(level,maxlvl) - offset)/range) + (10 - target AC). If need is 21-25 it becomes 20.", "source": "arogue7.7/fight.c:303-322"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Class THAC0 table", "text": "Base/maxlvl/range: fighter 10/30/2, ranger 10/20/2, paladin 10/23/2, magic user 9/18/5, cleric 10/19/3, thief 10/25/4, assassin 10/25/4, druid 10/19/3, monk 10/25/3, monsters 7/30/2.", "source": "arogue7.7/rogue.c:155-166"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Hit points per level", "text": "Class hit dice: fighter d12, paladin d10, ranger/cleric/druid d8, magic user/thief/assassin/monk d6, matching the manual.", "source": "arogue7.7/rogue.c:155-166; arogue7.7/arogue77.doc:100-190"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Attribute bonuses", "text": "To-hit from Str (str-10)/3, damage (str-9)/2, Dex to-hit (dex-13)/3 above 10 else (dex-10)/3, armor class (dex-10)/2.", "source": "arogue7.7/fight.c:838-878"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Multiple attacks", "text": "Fighters swing lvl/9+1 times per combat round, paladins lvl/12+1, rangers lvl/13+1, unarmed monks lvl/5+1. The total recovery time is divided, not each attack.", "source": "arogue7.7/move.c:1004-1022"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Attack timing", "text": "Attacks take FIGHTBASE 10 plus the weapon's rate (artifacts take 1), minus dexterity bonuses; haste halves, slow doubles. Movement base is 6 ticks, plus armor and heavy pack penalties.", "source": "arogue7.7/move.c:1000-1007; arogue7.7/move.c:1379-1428; arogue7.7/rogue.h:365"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Monk fists", "text": "Unarmed monks deal (level/3+1)d4, get -level*2/3 armor class, move faster by lvl/6, and need no weapon: their fists count as +1, +2 and +3 weapons against magic-only monsters at levels 6, 11 and 16.", "source": "arogue7.7/fight.c:45-58,348-355; arogue7.7/util.c:50-51; arogue7.7/move.c:849-851"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Backstab", "text": "Thieves and assassins can backstab non-NOSTAB, visible monsters that are asleep, held or frozen. Damage multiplier is 2+(lvl-1)/4, capped at 5 (+1 with the Musty daggers).", "source": "arogue7.7/fight.c:131-139,637-643"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Assassination", "text": "Assassins instead roll for a kill: chance 50 + 5*(your level - target level), +20 with a poisoned weapon; success deals hp+1 damage. Uniques are immune.", "source": "arogue7.7/fight.c:143-153,653-655"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Poison weapons", "text": "A poisoned weapon deals extra damage of target hp/2, or hp/4 if it saves vs poison at -2; the poison is used up on the first hit.", "source": "arogue7.7/fight.c:645-653"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Saving throws", "text": "Need is table value reduced per level by class (fighters/rangers/paladins/monsters (lvl-1)/2, magicians 2(lvl-1)/5, clerics/druids (lvl-1)/3, thief/assassin/monk 2(lvl-1)/4); protection from rings and cloaks caps at +4; 1 always fails and 20 always saves (except uniques can fail on 1).", "source": "arogue7.7/util.c:1085-1135"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Turn undead", "text": "Cleric level >= 3 x monster level destroys it; otherwise it flees if rnd(100)+1 > 100*(2*mlvl - lvl)/lvl. Paladins need level 5 and count as level-4. A monster that was already turned cannot be turned again, and intelligent ones (Int>16) \"laugh at you...\".", "source": "arogue7.7/player.c:33-143"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Spell budget", "text": "Magic users cast spells with ability = level*Int (divided by 3 for rangers); spells known = level + (Int-15 if Int>=16), up to 20. Recovery uses max(30-level,5) minus max(17-Int,0), floor 5.", "source": "arogue7.7/player.c:152-195; arogue7.7/rogue.h:366; arogue7.7/daemons.c:633-641"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Spell lists", "text": "Magic user spells are existing item effects with a cost: magic detection (3), identify (5), light (7), remove curse (7), confusion (10), magic missile (15), teleport, sleep, flying, see invisible (20 each), cold/lightning/fire (25), haste and cancellation (30), phase (40), hold (50), charging (55), protection (60), enchantment (70).", "source": "arogue7.7/rogue.c:442-466"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Prayers and chants", "text": "Cleric prayers: monster detection (3), magic detection (7), light (10), remove curse (15), healing (20), food detection (24), trap finding, cure disease, paralyze, magic mapping, clear thought, fear, see invisible, restore abilities, phase, teleportation, curing (50) and drain life (50). Druid chants include fire/cold/lightning resistance at 30 and charm monster at 50.", "source": "arogue7.7/rogue.c:468-505"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Regeneration", "text": "Resting regeneration depends on class: below level 8 you gain 1 hp after (16-2*lvl) quiet turns for fighters/rangers/paladins and (8-lvl) for others; from level 8 you gain rnd(lvl-k)+1 every 3 quiet turns (k=5 fighter types, 3 casters, 2 thief types). Regeneration rings add 1 hp per ring, with 8 ring slots.", "source": "arogue7.7/daemons.c:26-92"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Armor class", "text": "Lower is better (10 base). Armor table AC: leather 8, ring mail 7, studded leather 7, scale 6, padded 6, chain 5, splint 4, banded 4, plate mail 3, plate armor 2. Metal immunity (NOMETAL) makes weapons pass through monsters except artifacts.", "source": "arogue7.7/rogue.c:239-252; arogue7.7/fight.c:683-690"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Heavy armor slows you", "text": "Wearing leather-type armor adds 1 tick to your move delay, chain-type 2, plate armor 3 (adjusted by enchantment); a pack over 75% of capacity adds 1.", "source": "arogue7.7/move.c:1386-1417"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Blessed weapons attack faster", "text": "A weapon's speed rate is adjusted by its plus: cursed weapons are slower, blessed ones faster.", "source": "arogue7.7/move.c:1824-1832"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Vampiric regeneration ring", "text": "With the ring you heal half of damage you deal in melee.", "source": "arogue7.7/fight.c:682-685"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Magic-only monsters", "text": "Monsters flagged MAGICHIT, BMAGICHIT, CMAGICHIT need weapons with +1, +2, +3 or better to be hit; artifacts always can.", "source": "arogue7.7/fight.c:32-61"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Half damage", "text": "Vecna alone has HALFDAMAGE, so every hit on him is halved.", "source": "arogue7.7/rogue.c:1671-1680; arogue7.7/fight.c:633"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Artifact use by monsters", "text": "Monsters holding an artifact use it with a base 90% chance; each use cuts that chance (staff x4/5, rod x1/2, mandolin x2/3 or x1/3 on save, horn x3/4 or x1/3).", "source": "arogue7.7/monsters.c:279; arogue7.7/misc.c:134-215; arogue7.7/actions.c:960-966"}, {"game": "Rogue 3.6", "category": "combat", "title": "To-hit roll", "text": "swing() rolls rnd(20)+1 (1..20) and hits when roll + wplus >= (21 - attacker_level) - defender_AC. Put differently: d20 + level + AC + bonuses >= 21. A level-1 hero with no bonus hits a jackal (AC 7) on 13+ = 40%. wplus is weapon hplus + ring bonus + str_plus.", "source": "rogue3.6/fight.c:308-314"}, {"game": "Rogue 3.6", "category": "combat", "title": "Armor class: lower is better, 5% per point", "text": "Defender AC is subtracted straight into the need number, so every point of AC is worth 5% to-hit. The hero's AC is cur_armor->o_ac itself (ring mail starts at 6 = 7-1), not 10 minus armor; unarmored uses base 10. Armor base values: leather 8, ring 7, studded 7, scale 6, chain 5, splint 4, banded 4, plate 3.", "source": "rogue3.6/fight.c:404-411; rogue3.6/init.c:341-350"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Only one ring of protection counts", "text": "In roll_em the protect-ring check is 'if LEFT ... else if RIGHT', so wearing two rings of protection only applies the left one to armor class in combat. Rogue 5.4 rewrote this as two independent ifs, so both rings stack there.", "source": "rogue3.6/fight.c:408-411; rogue5.4/fight.c:452-455"}, {"game": "Rogue 3.6", "category": "combat", "title": "Damage strings and multi-attacks", "text": "Damage is a string such as \"1d8/1d8/3d10\" parsed with atoi/strchr('d')/strchr('/'). Each '/'-separated part is its own swing at its own to-hit roll, so the dragon makes three separate attacks. Each hit does roll(n,s) + weapon dplus + add_dam(str), floored at 0 by max(0,damage). Monsters have strength 10 so their bonus is 0.", "source": "rogue3.6/fight.c:393-427; rogue3.6/init.c:83"}, {"game": "Rogue 3.6", "category": "combat", "title": "Strength tables", "text": "str_plus (to-hit): 18/100 = +3, 18/51-99 = +2, 17 and 18/00-50 = +1, 7-16 = 0, below 7 = str-7. add_dam: 18/100 = +6, 18/91+ = +5, 18/76+ = +4, 18/01-75 = +3, 18/00 = +2, 16-17 = +1, 7-15 = 0, below 7 = str-7. The hero starts at 16 (+1 damage), with a 1% chance of 18/rnd(100)+1.", "source": "rogue3.6/fight.c:543-585; rogue3.6/init.c:120-127"}, {"game": "Rogue 3.6", "category": "combat", "title": "Experience table and level-up HP", "text": "e_levels is 10,20,40,...,20480 doubling, then 40920 (see oddity), 81920 ... 2621440 (19 thresholds, so level 20 is the cap). Level is 1 plus the number of thresholds reached, so 10 XP gives level 2. Gaining levels adds roll(levels_gained,10) to max HP (a d10 per level, no Con), and the hero starts at 12 HP.", "source": "rogue3.6/fight.c:19-21, 321-340; rogue3.6/init.c:118"}, {"game": "Rogue 3.6", "category": "oddity", "title": "40920 typo in the XP table", "text": "The experience table doubles perfectly (10240, 20480) and then reads 40920 instead of 40960. It is a long-standing typo, and srogue copies it too. It shifts one level threshold by 40 XP.", "source": "rogue3.6/fight.c:21; srogue/global.c:441"}, {"game": "Rogue 3.6", "category": "combat", "title": "HP regeneration", "text": "doctor() runs each turn and 'quiet' counts turns since the last HP change or fight. Below level 8 the hero gains 1 HP when quiet > 20 - 2*level (level 1: every 19th quiet turn, level 7: every 7th). At level 8+ once quiet >= 3 the hero gets rnd(level-7)+1 HP per turn. Each ring of regeneration adds +1 per turn and fighting resets quiet to 0.", "source": "rogue3.6/daemons.c:22-47; rogue3.6/fight.c:48"}, {"game": "Rogue 3.6", "category": "combat", "title": "Hunger clock", "text": "Start 1300 food (HUNGERTIME), cap 2000 (STOMACHSIZE). A ration gives 1300 + rnd(400) - 200. 'Hungry' appears below 300 (2*MORETIME), 'Weak' below 150, and at 0 or less each turn there is a 21% chance (rnd(100) > 20 returns early otherwise) to faint for rnd(8)+4 turns. Per-turn cost is 1 + ring_eat(left) + ring_eat(right) - amulet (regeneration 2, sustain strength 1, searching 33% for 1, slow digestion 50% for -1), so carrying the Amulet cancels the base 1. 3.6 never kills by starvation, only fainting.", "source": "rogue3.6/rogue.h:119-121; rogue3.6/misc.c:253; rogue3.6/daemons.c:140-174"}, {"game": "Rogue 3.6", "category": "combat", "title": "Slow and hasted monsters", "text": "In runners(), a slowed monster only calls do_chase on turns where t_turn is TRUE (every other turn), and a hasted one gets a second do_chase. Wand of haste monster on a slowed monster only removes the slow flag (and slow on a hasted one removes the haste), so it takes two zaps to haste a normal monster back.", "source": "rogue3.6/chase.c:30-42; rogue3.6/sticks.c:226-240"}, {"game": "Rogue 3.6", "category": "combat", "title": "Thrown weapons and launchers", "text": "There is no bow multiplier. An arrow fired from a wielded bow uses its hurl damage (1d6) plus the bow's hplus/dplus. Thrown without the launcher, an ISMISL item uses its wielded damage instead: arrow 1d1, dagger 1d6 (not the 1d4 hurl value), spear 1d8, while non-missile weapons such as the mace use hurl damage 1d3.", "source": "rogue3.6/fight.c:357-368; rogue3.6/weapons.c:40-52"}, {"game": "Rogue 3.6", "category": "combat", "title": "Cursed items at creation", "text": "Weapons are 10% cursed (hplus -1..-3) and 5% blessed (+1..+3 to-hit only, dplus never changes). Armor is 20% cursed (AC worse by 1..3) and 8% better by 1..3. Add-type rings give rnd(3), and a roll of 0 becomes -1 and cursed (33%); aggravate monster and teleportation rings are always cursed. There is no ISPROT flag in 3.6, so armor cannot be protected from rust. Rogue 5.4 keeps the same odds.", "source": "rogue3.6/things.c:292-346"}, {"game": "Rogue 3.6", "category": "combat", "title": "Monster HP, XP and depth", "text": "A monster has roll(level,8) HP and a fixed XP value, with no scaling by dungeon depth. Difficulty comes only from randmonster picking letter index depth + rnd(10) - 5 in \"KJBSHEAOZGLCRQNYTWFIXUMVDP\". Wandering monsters use a version with blanks, so E, L, N, T, F, M, D and P never wander in.", "source": "rogue3.6/monsters.c:21-45, 66"}, {"game": "Rogue 3.6", "category": "combat", "title": "Rust monster", "text": "Each hit that lands raises the worn armor's AC by 1 as long as it is below 9, and it affects every armor type (leather included). Armor can therefore never rust past AC 9, and nothing short of removing the armor prevents it. Rogue 5.4 turned this into the aquator and exempted leather.", "source": "rogue3.6/fight.c:123-137; rogue5.4/move.c:406-425"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Violet fungus damage grows by itself", "text": "A fungus hit makes the hero held and rewrites the monster table damage string to '%dd1' with ++fung_hit, so successive hits do 1d1, 2d1, 3d1. Even a miss costs fung_hit HP and the counter only resets on a kill.", "source": "rogue3.6/fight.c:200-204, 274-279, 699"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Floating eye paralysis stacks", "text": "A floating eye hit adds rnd(2)+2 (2-3) turns to no_command each time and it also has no damage dice (0d0), so it can only kill by starvation: death only if no_command > 100 and food_left <= 0. Blind heroes are immune.", "source": "rogue3.6/fight.c:138-153"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Leprechaun and nymph theft", "text": "Leprechaun takes GOLDCALC (rnd(50+10*level)+2) and, on a failed magic save, 4 more GOLDCALC, then vanishes whether or not any was taken. Nymph picks a random unequipped magic item by reservoir sampling (rnd(++nobj)==0), after a 'Nymph bug fix' that excluded worn rings.", "source": "rogue3.6/fight.c:166-181, 228-268; rogue3.6/rogue.h:70"}, {"game": "Rogue 3.6", "category": "oddity", "title": "14-bit random numbers", "text": "The RN macro is ((seed*11109+13849) & 0x7fff) >> 1, which only yields 0..16383. rnd(range) is abs(RN) % range, so ranges above 16384 can never be reached.", "source": "rogue3.6/rogue.h:43; rogue3.6/main.c:262-265"}, {"game": "Rogue 5.4", "category": "combat", "title": "To-hit roll", "text": "swing() rolls rnd(20) (0..19) and hits if roll + wplus >= (20 - level) - AC, which is the same probability as 3.6's rnd(20)+1 against 21-level-AC. The new rule is in roll_em: if the defender is not ISRUN (asleep or held) the attacker gets +4 to hit.", "source": "rogue5.4/fight.c:379-386, 445-446"}, {"game": "Rogue 5.4", "category": "combat", "title": "Damage strings use 'x'", "text": "Dice strings are 'NxM' (e.g. \"3x4\" long sword), parsed with strchr('x'), but still '/'-separated multi-attacks. Dragon is 1x8/1x8/3x10, centaur 1x2/1x5/1x5, griffin 4x3/3x5. Damage is roll + dplus + add_dam[str], floored at 0.", "source": "rogue5.4/fight.c:457-479; rogue5.4/extern.c:190-221"}, {"game": "Rogue 5.4", "category": "combat", "title": "Strength tables are plain arrays", "text": "str_plus[] and add_dam[] are indexed by raw strength (no 18/xx). str_plus: 3-6 = -4..-1, 7-16 = 0, 17-20 = +1, 21-30 = +2, 31 = +3. add_dam: 16-17 = +1, 18 = +2, 19-20 = +3, 21 = +4, 22-30 = +5, 31 = +6. The hero starts at strength 16.", "source": "rogue5.4/fight.c:46-59; rogue5.4/extern.c:166"}, {"game": "Rogue 5.4", "category": "combat", "title": "Experience table", "text": "e_levels: 10,20,40,80,160,320,640,1300,2600,5200,13000,26000,50000,100000,200000,400000,800000,2000000,4000000,8000000. It is a smoothed table (1300 instead of 1280, 13000 instead of 10240). Level-up adds roll(levels,10) max HP and also current HP, with no cap at max.", "source": "rogue5.4/extern.c:124-146; rogue5.4/misc.c:324-342"}, {"game": "Rogue 5.4", "category": "combat", "title": "Monster XP and depth scaling", "text": "exp = base + 10*lev_add + exp_add, where exp_add is maxhp/8 for level-1 monsters or maxhp/6 for others, times 4 above level 6 and times 20 above level 9, so well-rolled monsters pay more. Past the Amulet level (26) each dungeon level adds a monster level, -1 AC and +10 XP, and from level 30 on all monsters are hasted.", "source": "rogue5.4/monsters.c:60-111"}, {"game": "Rogue 5.4", "category": "combat", "title": "Monster speed and flyers", "text": "move_monst gives slowed monsters a move on alternate turns and hasted ones two moves. Flyers (bats, griffins, kestrels) get a free extra move whenever dist_cp() to the hero is 3 or more. Every monster generated at dungeon level 30 or deeper gets ISHASTE.", "source": "rogue5.4/chase.c:30-80; rogue5.4/monsters.c:83-84"}, {"game": "Rogue 5.4", "category": "combat", "title": "Hunger and starvation", "text": "Hungry < 300, Weak < 150, then at <= 0 the hero faints with 20% chance (rnd(5)==0) for rnd(8)+4 turns, and dies of starvation after STARVETIME (850) more turns below zero. ring_eat: regeneration costs 2, protection/strength/stealth/sustain 1; searching, add hit and add damage cost 1 with 1-in-3 chance per turn, see invisible 1-in-5, and slow digestion refunds 1 with 1-in-2 chance.", "source": "rogue5.4/daemons.c:139-188; rogue5.4/rings.c:159-180; rogue5.4/rogue.h:121-124"}, {"game": "Rogue 5.4", "category": "combat", "title": "Vampire and wraith drain", "text": "A wraith hit has a 15% chance to cost one level and roll(1,10) HP and max HP; a vampire has a 30% chance to only cost roll(1,3) max HP. If max HP falls to 0 or less the hero dies of that monster.", "source": "rogue5.4/fight.c:234-266"}, {"game": "Rogue 5.4", "category": "oddity", "title": "Venus flytrap extra damage", "text": "A flytrap hit holds the hero, takes 1 HP directly, and rewrites its own damage string to '%dx1' with ++vf_hit. A miss still costs vf_hit HP, and killing it resets vf_hit and restores the table's '000x0' string.", "source": "rogue5.4/fight.c:267-274, 328-333; rogue5.4/monsters.c:646"}, {"game": "Rogue 5.4", "category": "combat", "title": "Thrown weapons and launchers", "text": "No multiplier: a launched arrow uses its hurl damage (2x3) plus the bow's hplus/dplus. Thrown by hand, an ammo item with a launcher (o_launch >= 0) uses plain 1x1, while any non-ammo weapon (o_launch == NO_WEAPON < 0) uses hurl damage, so a thrown dagger does 1x4. The dagger's flags are written ISMISL|ISMISL (harmless doubled flag), and sling/crossbow were dropped from 3.6. Starting kit: +1,+1 mace 2x4, +1 bow, 25-39 arrows, ring mail AC 6.", "source": "rogue5.4/fight.c:427-440; rogue5.4/weapons.c:25-35; rogue5.4/init.c:24-74"}, {"game": "Rogue 5.4", "category": "combat", "title": "Saving throws", "text": "save_throw: roll d20 >= 14 + which - level/2. Constants are VS_POISON/PARALYZATION/DEATH 0, BREATH 2, MAGIC 3. A level-1 hero saves vs poison on 14+ (35%). Rings of protection lower the number only for VS_MAGIC.", "source": "rogue5.4/monsters.c:238-261; rogue5.4/rogue.h:139-143"}, {"game": "Rogue 5.4", "category": "oddity", "title": "Double-haste faint", "text": "Quaffing haste while already hasted makes the hero faint from exhaustion for rnd(8) turns and removes the haste. A normal haste potion lasts rnd(4)+4 turns of fuse time.", "source": "rogue5.4/misc.c:385-402"}, {"game": "Rogue 5.4", "category": "combat", "title": "Wand of magic missile and drain life", "text": "Magic missile is a bolt with hplus 100 (always hits), 1x4 +1 dplus, negated only if the monster saves vs magic; because o_launch is set to the wielded weapon's type it also borrows the wielded weapon's hplus/dplus. Drain life halves the hero's current HP and splits that amount evenly among all monsters in the room or corridor, refusing below 2 HP.", "source": "rogue5.4/sticks.c:175-191, 249-295"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Class-based to-hit matrix", "text": "need = base - factor*((min(lvl,max_lvl)-offset)/range) + (10 - AC); you hit if rnd(20)+1 + bonuses >= need. Rows: fighter {10,25,2,1,2} (-2 every 2 levels), magician {9,18,2,1,5}, cleric {10,19,2,1,3}, thief {10,21,2,1,4}, monster {7,25,1,0,2}. Needs of 21-25 are clamped to 20 (always a 5% natural-20 hit), above 25 never hits.", "source": "arogue5.8/fight.c:24-31, 711-726"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Strength and dexterity bonuses use integer division", "text": "str_plus = (str-10)/3, add_dam = (str-9)/2, dext_plus = (dex>10 ? (dex-13)/3 : (dex-10)/3), dext_prot = (dex-10)/2 as C truncating division. So strength 8-12 gives 0 to-hit, 16 gives +2 and +3 damage, 25 gives +5/+8, and dexterity 11-15 gives no to-hit bonus at all (first +1 at 16). Dex also lowers the defender's AC.", "source": "arogue5.8/fight.c:1166-1205"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Backstab multiplier", "text": "Backstabs add +4 to-hit and multiply damage by 2 + (level-1)/4 (x2 at levels 1-4, x3 at 5-8 ...). Monsters are capped at x5 but the player is not capped in 5.8, so a level-21 thief gets x7; arogue7.7 and xrogue cap everyone at x5. Musty Dagger adds one more multiplier.", "source": "arogue5.8/fight.c:955-970"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Level-up and XP", "text": "Fighter levels start at 90 XP and double each level up to a cap of 1,474,560 (= 90*2^14), then +cap per further level. Magician 130, cleric 110, thief 75. HP per level is a class die (fighter d10, magician d4, cleric d8, thief d6) plus constitution bonus, at least 1.", "source": "arogue5.8/util.c:73-135"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Class-dependent regeneration (monsters too)", "text": "doctor() is called for every creature, including regenerating monsters. Fighter: level<8 heals 1 HP after quiet > 16-2*level; magician/cleric after > 8-level; at level 8+, every 3 quiet turns it heals rnd(level - 5)+1 for fighters (level-3 mage/cleric, level-2 thief). Disease or rot stops it.", "source": "arogue5.8/daemons.c:25-90"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Hunger depends on pack weight", "text": "food_use per turn = foodlev (1-3) + ring costs + 1 per relic carried; foodlev is 3 above 80% of carry capacity (80% chance per check), 2 above 60% (60% chance), else 1. Start 1300, cap 2000, weak below 150, hungry below 300. hitweight() returns 2 - foodlev, so a light pack gives +1 to-hit and a heavy pack -1.", "source": "arogue5.8/daemons.c:305-330; arogue5.8/encumb.c:21-40, 165-175"}, {"game": "Advanced Rogue 5.8", "category": "oddity", "title": "Stale foodlev when over 80% but roll fails", "text": "When the pack is over 80% of capacity foodlev only becomes 3 with an 80% chance; on the other 20% it silently keeps whatever value it had, so it only gets reset downward by an explicit 'else' branch below 60%. Heavy packs are therefore sticky rather than random.", "source": "arogue5.8/encumb.c:28-40"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Special melee effects", "text": "Vampire (CANSUCK) halves current HP on a failed magic save; sucker (CANDRAW) takes a flat 12 HP and flees; hugger squeezes for 2d8 if either of two d20 rolls is >=18 (27.75%); wraith 15% level drain; stone-touch kills at 15% only after a failed petrification save. Rust monsters hit non-leather armor only, acid dissolves leather, and bracers are destroyed at AC 0.", "source": "arogue5.8/fight.c:255-262, 312-318, 337-350, 472-485, 511-517"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Weapon table", "text": "Long sword is 1d12, bastard sword 2d8, two-handed 3d6, pike 1d12, trident 3d4, halberd 2d6; arrow hurl 1d6, crossbow bolt 1d12, short bow and crossbow melee 1d1. There is no launcher multiplier; ammo needs the matching launcher in the pack. ISMETAL weapons deal 0 to NOMETAL monsters.", "source": "arogue5.8/rogue.c:164-184; arogue5.8/fight.c:973-982"}, {"game": "Advanced Rogue 5.8", "category": "combat", "title": "Armor table", "text": "AC: leather 8, ring 7, studded 7, scale 6, padded 6, chain 5, splint 4, banded 4, plate mail 3, plate armor 2 (weights 100-450). Hero AC = armor AC minus ring protection, bracers and cloak, capped at 10. Cloak of displacement makes the first attack from each monster do no damage (MISSEDDISP); arogue7.7 adds that attackers with Intelligence 22+ see through it.", "source": "arogue5.8/rogue.c:186-197; arogue5.8/util.c:170-190; arogue5.8/fight.c:984-1000"}, {"game": "Advanced Rogue 5.8", "category": "oddity", "title": "Heil's ankh and relic damage", "text": "Relic weapons use special strings: Musty Dagger 1d4+1/1d4+1 with +6/+6 bonus if str and dex >15 (else -3), Yeenoghu flail 3d6/paralyze/confuse, Orcus wand 'destroy'. Orcus kills outright on a failed save at -4 and gives the wielder half the victim's HP. Heil's ankh forces maximum damage rolls (ndice*nsides).", "source": "arogue5.8/fight.c:753-775, 836-852, 931-946"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Nine classes with data-driven to-hit", "text": "char_class[] gives per-class start XP, cap, hit die, base, max level, factor, offset, range: fighter 80/1,310,720/d12 {10,30,2,1,2}, ranger d8, paladin d10, magic user d6 {9,18,2,1,5}, cleric d8, thief d6, assassin d6, druid d8, monk d6. The formula is unchanged: need = base - factor*((min(lvl,max)-offset)/range) + 10 - AC.", "source": "arogue7.7/rogue.c:153-167; arogue7.7/fight.c:303-318"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Dangling else drops strength bonus for non-monks", "text": "In roll_em the player-attacks-monster branch reads 'if (monk) if (weap==NULL) hplus += lvl/5; else hplus += str_plus+dext_plus'. The else binds to the inner if, so a monk with a weapon gets the str/dex to-hit bonus, a barehanded monk gets lvl/5, and every other class gets no strength or dexterity to-hit bonus at all. (Damage add_dam is separate and still applies.)", "source": "arogue7.7/fight.c:516-523"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Assassin assassination", "text": "A sneak attack on a sleeping, held or frozen monster by an assassin first rolls 50 + 5*(player level - monster level) percent (+20 if wielding a poisoned weapon), and always fails against uniques. On success the damage is set to monster HP + 1, an instant kill; on failure it is an ordinary attack without the backstab bonus.", "source": "arogue7.7/fight.c:128-152, 654"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Hunger tuned down", "text": "STOMACHSIZE 1500, MORETIME 100: hungry below 200, weak below 100, and the hero starts at 1399 food. A food ration restores 800. When food <= 0 each turn has a 21% chance to start a faint of movement*(rnd(8)+4) ticks, and if already fainted once there is a 1-in-20 chance of dying of starvation per attempt.", "source": "arogue7.7/rogue.h:392-394; arogue7.7/rogue.c:70, 416; arogue7.7/daemons.c:295-368"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Choking on food", "text": "Eating when you are already F_SATIATED (food above 1400) and the meal tops the stomach to 1500 gives a 1-in-4 chance to 'choke on all that food and die'. XRogue copies this mechanic.", "source": "arogue7.7/eat.c:47-56; xrogue/eat.c:51-59"}, {"game": "Advanced Rogue 7.7", "category": "combat", "title": "Speed in ticks", "text": "movement() returns ticks per action: base t_movement (hero 6), +1/+2/+3 for unenchanted armor by weight class (enchantment subtracts), +1 if pack is above 75% of capacity, minus dext_plus; slow doubles, haste halves, minimum 1. Faint duration is also multiplied by it.", "source": "arogue7.7/move.c:1379-1436; arogue7.7/init.c:574"}, {"game": "Super-Rogue", "category": "combat", "title": "To-hit", "text": "swing() is 3.6's d20+1 against (21-level)-AC. Added: hero's dexterity changes the defender's armor via getpdex(def,FALSE) (dex 18 = -4 AC, 6 = +1) and thrown missiles add getpdex(att,TRUE) (dex 18 = +3). Hero to-hit also gets hitweight() (2 - foodlev) for pack load.", "source": "srogue/fight.c:352-359, 456-461; srogue/pstats.c:163-212"}, {"game": "Super-Rogue", "category": "combat", "title": "Strength bonus tables", "text": "str_plus: 17-20 = +1, 21-23 = +2, 24 = +3, above 24 = str-21, 6-7 = -1, 4-5 = -2, below 4 = -3. add_dam: 16-17 = +1, 18 = +2, 19-20 = +3, 21-22 = +4, 23 = +5, 24 = +6, above 24 = str-18, 7-15 = 0, 3-6 = -1 (never worse than -1). Hunger subtracts 1 or 2 damage when weak or fainting.", "source": "srogue/pstats.c:285-361"}, {"game": "Super-Rogue", "category": "combat", "title": "Character generation", "text": "Hit points and each of strength, dexterity, wisdom and constitution come from pinit(): roll 4d6, drop the lowest (3-18). So starting HP is 3-18 (averaging around 12), not a fixed 12. Level-ups give roll(levels,10) + levels*constitution bonus.", "source": "srogue/init.c:291-335; srogue/fight.c:366-384"}, {"game": "Super-Rogue", "category": "combat", "title": "Starvation", "text": "HUNGTIME 300 (hungry), WEAKTIME 150, STOMACHSIZE 2000. At 0 food each turn has 21% chance to faint for rnd(8)+4 turns; 'stomach writhes with hunger pains' at -150 and you starve to death below -350, a shorter margin than rogue5.4's 850.", "source": "srogue/rogue.h:244-247; srogue/daemons.c:145-186"}, {"game": "Super-Rogue", "category": "combat", "title": "Monster levels by depth", "text": "Below the amulet level (35), a monster gains (level-35)/4 levels, and +1 level each for treasure rooms, maze levels, and when the hero is going back up. HP = roll(level,8), and kill XP = base * (0.47 + hp/(8*level)), so a monster with minimum HP gives about 0.6x base and a max-HP one about 1.47x.", "source": "srogue/monsters.c:116-148; srogue/rogue.h:56"}, {"game": "Super-Rogue", "category": "oddity", "title": "mindex only searches 3 characters", "text": "The damage-string finder mindex() loops three times and then checks once more, so it only finds 'd' or '/' within the first four characters. The stock strings are short enough that this works.", "source": "srogue/fight.c:478-494"}, {"game": "Super-Rogue", "category": "combat", "title": "Letter-coded attacks", "text": "Quasit steals dexterity, ulodyte and pseudo-dragon gnaw strength, bone devil stings strength by roll(1,4) and may hold, green dragon breath does 1d8 unless you save, hell hound 1d4 sear, wuccubi cost 1 max HP, imp slows (ISSLOW fuse roll(5,10)), cockatrice kills on a failed petrification save. A floating eye paralyses for rnd(16)+25 turns but not while already paralysed.", "source": "srogue/fight.c:163-290"}, {"game": "XRogue", "category": "combat", "title": "Hit dice by class", "text": "char_class[] shows d13 fighter, d10 ranger/paladin/monk, d9 magician/cleric/druid, d11 thief/assassin as hit dice, much bigger than arogue7.7. Level-up gives max(1, d(hit die) + Con bonus) per level. XP thresholds start at 90-110 and double until each class's cap.", "source": "xrogue/rogue.c:145-157; xrogue/util.c:128-166"}, {"game": "XRogue", "category": "oddity", "title": "Same dangling-else bug as arogue7.7", "text": "The identical 'if monk / if weap==NULL ... else' construction in roll_em means non-monk players get no strength or dexterity to-hit bonus when attacking monsters. Monsters attacking each other do use it.", "source": "xrogue/fight.c:541-548"}, {"game": "XRogue", "category": "combat", "title": "AC cap is 25 and Emori cloak is -15", "text": "ac_compute caps armor class at 25 (arogue caps at 10), and the Emori cloak gives -15 (-5 in arogue). Monster scaling: above dungeon level 40 monsters get level +(vlevel-40), HP dice +(vlevel-40)/2 and AC lowered by (vlevel-40)/4.", "source": "xrogue/util.c:27-55; xrogue/monsters.c:263-266; xrogue/rogue.h:69"}, {"game": "XRogue", "category": "combat", "title": "Hunger", "text": "STOMACHSIZE 2100, MORETIME 80: weak below 80, hungry below 160, start at 2019. Fainting only triggers on 13% of turns (rnd(100) > 12 returns), with 1-in-28 starvation chance on each repeat. Food ration is 690.", "source": "xrogue/rogue.h:402-403; xrogue/rogue.c:59, 412; xrogue/daemons.c:306-377"}, {"game": "XRogue", "category": "combat", "title": "Class-dependent regeneration", "text": "Resting thresholds: magician 10-level, cleric/druid 12-level, thief/assassin 14-level, monk 16-level, ranger/paladin 18-level, fighter 20-level. At level 8+ heal rnd(level-k)+1 every 3 quiet turns where k is 2,3,4,5,6,7 for those classes. Mages heal faster than fighters.", "source": "xrogue/daemons.c:27-90"}, {"game": "UltraRogue", "category": "combat", "title": "Strength tables jump at 19", "text": "strtohit[] and str_damage[] are indexed 0..25. Strength 16: +0/+1, 17: +1/+1, 18: +1/+2, 19: +3/+7, 20: +3/+8, 21: +4/+9, 22: +4/+10, 23: +5/+11, 24: +6/+12, 25: +7/+14. Going from 18 to 19 raises the damage bonus from +2 to +7.", "source": "urogue/fight.c:1722-1770"}, {"game": "UltraRogue", "category": "combat", "title": "XP and level-up", "text": "e_levels gives the first threshold per class: fighter 143, paladin 182, ranger 169, cleric 127, druid 154, magician 185, illusionist 169, thief 112, assassin 126, ninja 319. Each level doubles it; excess XP is subtracted so s_exp is XP into the current level. HP per level: d12 fighter/paladin/ranger, d8 cleric/druid, d6 thief family, d4 mage/illusionist, plus Con bonus, min 1.", "source": "urogue/fight.c:29-40, 1239-1350"}, {"game": "UltraRogue", "category": "combat", "title": "Class tricks in roll_em", "text": "Fighters stun a monster for rnd(4)+1 turns when one hit exceeds 1/3 of its max HP (and gain 1/4 of its XP); rangers add +level damage vs large monsters, ninjas +level/2; thieves, ninjas and assassins multiply damage by level/4 + 2 on sleeping/held monsters (ninja/assassin also get half the monster's XP).", "source": "urogue/fight.c:1456-1556"}, {"game": "UltraRogue", "category": "combat", "title": "Silver, poison and fire", "text": "A silver weapon hits automatically when the monster fails a magic save, since the save is checked before swing(); silver does double damage to undead. Poisoned weapons deal at least HP/2+5 unless the monster saves; half-damage monsters are not halved if burned by a CANBURN weapon and fireproof monsters take 0 from burning ones.", "source": "urogue/fight.c:1427-1500"}, {"game": "UltraRogue", "category": "combat", "title": "To-hit matrix", "text": "att_mat has 11 rows: fighter/paladin/ranger {10,17,2,1,2}, cleric/druid {10,19,2,1,3}, magician/illusionist {9,21,2,1,5}, thief/assassin {10,21,2,1,4}. dext_plus = (dex-10)/3 goes to the attacker's to-hit and dext_prot = (dex-9)/2 to the defender's AC.", "source": "urogue/fight.c:43-55, 1216-1231, 1702-1720"}, {"game": "UltraRogue", "category": "oddity", "title": "Monster scaling uses (max_level-60) from level 31", "text": "For max_level > 30 monsters get roll(4,(max_level-60)*2) extra HP and similar level, AC, Str and XP bonuses, but (max_level-60) is negative until level 60. roll() of a non-positive side count gives 1 per die (rnd returns 0 and the die is +1), so levels 31-59 give every monster a flat +4 HP, +4 level, -2 AC, +2 Str.", "source": "urogue/monsters.c:266-273; urogue/main.c:263-289"}, {"game": "UltraRogue", "category": "oddity", "title": "Regeneration ring falls through to digestion", "text": "In ring_eat there is no break after R_REGEN/R_VREGEN, so these rings also run the R_DIGEST code on their o_ac. After the switch, rnd(luck) is added for every ring slot, even empty ones (luck is a counter bumped by certain events). The ring of regeneration also gives ring_value HP per turn in doctor, and ISREGEN monsters heal level/5+1 per turn.", "source": "urogue/rings.c:230-265; urogue/daemons.c:112-125"}, {"game": "Family", "category": "combat", "title": "AC and to-hit across the family", "text": "In all of them lower AC is better and AC goes straight into the need number, 5% per point against a d20. 3.6 and srogue use d20+1 against 21-level-AC, 5.4 uses a 0-based roll against 20-level-AC (same odds), and the Advanced family uses a per-class matrix with 'need = base - factor*steps + 10 - AC'.", "source": "rogue3.6/fight.c:310; rogue5.4/fight.c:382; arogue5.8/fight.c:718"}, {"game": "Family", "category": "combat", "title": "No launcher multiplier anywhere", "text": "Across Rogue 3.6, 5.4, arogue, xrogue and urogue, firing arrows from a bow never multiplies damage. The ammo's hurl damage replaces its melee damage and the launcher only adds its own hplus/dplus, which is why +bows matter.", "source": "rogue3.6/fight.c:357-368; rogue5.4/fight.c:427-440; urogue/fight.c:1372-1386"}, {"game": "Family", "category": "combat", "title": "Fainting chance when starving", "text": "Per turn at zero food: rogue3.6 21%, rogue5.4 20%, srogue 21%, arogue5.8/7.7 21%, urogue 21%, xrogue 13%. Starvation death: absent in 3.6, arogue5.8 and urogue (stomach() only faints), 850 turns in 5.4, 350 in srogue, and a random 1/20 (arogue7.7) or 1/28 (xrogue) per faint roll.", "source": "rogue3.6/daemons.c:149; rogue5.4/daemons.c:146-151; srogue/daemons.c:152-160; arogue7.7/daemons.c:314-316; xrogue/daemons.c:325-327"}, {"game": "Family", "category": "oddity", "title": "Santa Cruz origins", "text": "Michael Toy and Glenn Wichman wrote Rogue around 1980 at UC Santa Cruz on a VAX 11/780 with only 128 KB of memory available to them. Toy wanted to fix adventure games that never changed on replay; Toy did most of the early programming while Wichman learned C by watching him.", "source": "https://episodiccontentmag.com/2016/06/03/rogue_chapter1/"}, {"game": "Family", "category": "oddity", "title": "Toy was barely a student", "text": "Toy was 'theoretically attending' UCSC but, by his own account, was never anywhere except the computer lab. He was later kicked out over grades and moved to UC Berkeley for a computer-lab job, where he met Ken Arnold.", "source": "https://episodiccontentmag.com/2016/06/03/rogue_chapter1/"}, {"game": "Family", "category": "oddity", "title": "Why 'Rogue'", "text": "Wichman picked the name because it had to be short (easy to type as a command) and because, unlike party-based D&D, the character goes it alone.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Family", "category": "oddity", "title": "Yendor is Rodney backwards", "text": "The Amulet of Yendor is 'Rodney' spelled backwards; the idea came from Michael Toy. Wichman says the name Rodney arrived pretty much out of nowhere, though he suspects Sir Rodney from the Wizard of Id comic. (Note: RogueBasin's Rogue page claims Yendor reversed is 'Rogue', which is wrong.)", "source": "http://www.roguelikeradio.com/2012/04/episode-31-rogue-with-co-creator-glenn.html"}, {"game": "Family", "category": "oddity", "title": "The dog rumour", "text": "A commenter on the CRPG Addict blog claims Rodney was the programmer's dog. This is unsourced hearsay and contradicts Wichman's Wizard of Id guess.", "source": "https://crpgaddict.blogspot.com/2010/07/backtracking-amulet-of-yendor-1985-and.html"}, {"game": "Family", "category": "oddity", "title": "Curses was written for terminals", "text": "Ken Arnold's curses library let programs place text anywhere on a terminal, which made a map-view dungeon game possible. The name is a pun on 'cursor optimization', and the cursor-moving code was borrowed from vi, not the other way round.", "source": "https://en.wikipedia.org/wiki/Curses_(programming_library)"}, {"game": "Family", "category": "oddity", "title": "Separate Berkeley and Santa Cruz versions", "text": "Toy's move to Berkeley split development across two sites; Wichman said source could not easily be shared so they worked collaboratively, and eventually he stopped working on his own version. Toy later called the final game a straight collaboration between Glenn, Ken and himself.", "source": "https://episodiccontentmag.com/2016/06/03/rogue_chapter1/"}, {"game": "Family", "category": "oddity", "title": "Shipped with 4.2BSD", "text": "Rogue was included in the 4.2BSD distribution, which spread it across universities; Wichman says it was the most popular campus game for about three years. Unix co-creator Ken Thompson was reportedly a fan.", "source": "https://handwiki.org/wiki/Software:Rogue_(video_game)"}, {"game": "Family", "category": "oddity", "title": "Biggest waste of CPU cycles", "text": "Dennis Ritchie reportedly joked that Rogue was the biggest waste of CPU cycles in history.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Family", "category": "oddity", "title": "Source stayed closed until 4.3BSD", "text": "The original authors did not release source early, so Hack, Moria and others had to rebuild mechanics from scratch. Rogue source was finally released under a BSD licence with 4.3BSD in 1986.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Family", "category": "flavour", "title": "The 'roguelike' name", "text": "The term was settled on Usenet around 1993 when rec.games.roguelike was chosen as 'the least of all available evils' after about three weeks of debate, naming the genre after the oldest of Rogue, Hack, Moria and Angband.", "source": "https://en.wikipedia.org/wiki/Roguelike"}, {"game": "Rogue (all)", "category": "unique", "title": "Permadeath enforced by deleting saves", "text": "Players got around death by copying saves ('save scumming'), so the authors made the game delete the save file on load, which made death meaningful.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "flavour", "title": "Vi keys explained", "text": "Movement uses h/j/k/l, mirroring the vi editor; the player is '@' ('where they're at') and monsters are the 26 capital letters.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "flavour", "title": "Emu and the A-Z monster squeeze", "text": "One commenter on Roguelike Radio said Emu was a monster because the authors needed a creature for each letter while avoiding intellectual-property conflicts. Secondhand but fits the 26-letter design.", "source": "http://www.roguelikeradio.com/2012/04/episode-31-rogue-with-co-creator-glenn.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Memory-starved monster AI", "text": "Wichman recalled 128K of memory limiting monster behaviour: the instruction space was already full.", "source": "https://episodiccontentmag.com/2016/06/10/rogue_chapter2/"}, {"game": "Rogue (all)", "category": "oddity", "title": "A.I. Design born in Italy", "text": "Toy met Jon Lane at Olivetti, which was developing IBM PC compatibles. They founded A.I. Design to sell Rogue commercially.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "oddity", "title": "TSR-proof monster names", "text": "For commercial releases Lane used the extended IBM character set and replaced D&D-specific monsters to avoid copyright trouble with TSR. NetHack Wiki claims this renaming happened in 5.3, though I only saw that claim secondhand.", "source": "https://nethackwiki.com/wiki/Rogue_(game)"}, {"game": "Rogue (all)", "category": "oddity", "title": "Epyx steps in", "text": "In 1984 Epyx VP Robert Borch noticed employee enthusiasm for Rogue and funded Macintosh and Amiga ports. Epyx paid for three home-computer ports (Amiga, Atari ST, TRS-80 CoCo).", "source": "https://en.wikipedia.org/wiki/Epyx"}, {"game": "Rogue (all)", "category": "oddity", "title": "Mac version written in a ski cabin", "text": "Much of the Macintosh version was developed by Toy, Wichman and Lane in a cabin at the Squaw Valley ski resort. Wichman agreed to draw the Mac graphics in exchange for a used Mac.", "source": "http://www.wichman.org/roguehistory.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Who ported what", "text": "Toy programmed the Amiga version; Wichman wrote the Atari ST version with in-house Epyx artist Michael Kosaka.", "source": "http://www.wichman.org/roguehistory.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Commercial flop", "text": "Sales were initially fine, but the commercial versions failed because they were essentially the free BSD game. Epyx went bankrupt in 1989 and A.I. Design dissolved; the creators made little money.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "oddity", "title": "Catalogue-only marketing", "text": "Borch pushed Rogue through software catalogues rather than retail because it was hard to market in stores.", "source": "https://handwiki.org/wiki/Software:Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "oddity", "title": "Mastertronic budget ports", "text": "In 1988 Mastertronic released Rogue for Amstrad CPC, Commodore 64, Atari 8-bit and ZX Spectrum.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "oddity", "title": "DOS 'Rogue 1.0' is newer than 3.6.1", "text": "The IBM PC version numbered 1.0 (credited to Jon Lane) is actually more recent than Unix 3.6.1: it is A.I. Design's 1983 adaptation, not an earlier release.", "source": "https://datadrivengamer.blogspot.com/2019/04/game-60-rogue.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Boss key", "text": "The DOS port includes a boss key that shows a fake DOS screen. The decoded source is about 9,000 lines of C, 800 lines of assembly and 45 files, built with Aztec C.", "source": "https://www.maizure.org/projects/decoded-rogue/index.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "C with Pascal-like keywords", "text": "The DOS source redefines switch/case as when/otherwise via macros and uses sbrk() for memory since malloc was unavailable.", "source": "https://www.maizure.org/projects/decoded-rogue/index.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Pirate tombstone", "text": "A commenter reports cracked DOS copies had boosted monster damage and a tombstone reading 'Rest In Peace, Software Pirate, killed by Copy Protection Mafia'. Unverified comment.", "source": "https://datadrivengamer.blogspot.com/2019/04/game-60-rogue.html"}, {"game": "Rogue (all)", "category": "combat", "title": "Version differences 3.6 vs 5.4", "text": "3.6.3/DOS have one universal Identify scroll and a blank paper scroll, plus Light and Genocide scrolls (3.6.3 only) and Gold detection; 5.4 has no Protect Armor in 3.6 but does in 5.4. DOS also has Vorpalize Weapon (+4,+4 vs one monster).", "source": "https://nethackwiki.com/wiki/Rogue_(game)"}, {"game": "Rogue (all)", "category": "combat", "title": "Weapon list drift", "text": "Shurikens are absent from 3.6.3; slings and rocks exist in 3.6.3 but not 5.4.2; crossbows are not in 5.4.2.", "source": "https://nethackwiki.com/wiki/Rogue_(game)"}, {"game": "Rogue (all)", "category": "unique", "title": "Hunger without corpses", "text": "Rogue has just one attribute (strength) and no corpses or food from monsters, making hunger harsher than in NetHack.", "source": "https://nethackwiki.com/wiki/Rogue_(game)"}, {"game": "Rogue (all)", "category": "unique", "title": "Purse is the score", "text": "In Rogue 5.4 source rip.c, the final score is simply the gold in the purse; reasons include 'killed', 'quit', 'A total winner' and 'killed with Amulet'. Death shows an ASCII tombstone, and rogue -s shows the score table.", "source": "https://www.maizure.org/projects/decoded-rogue/index.html"}, {"game": "Rogue (all)", "category": "oddity", "title": "Version dates", "text": "Rogue Archive lists 3.6 (June 16, 1981), 5.2 (April 11, 1982) and 5.4 (about 3/31/1985) as the Unix milestones, with 5.4 the final original Unix version.", "source": "https://britzl.github.io/roguearchive/"}, {"game": "Rogue (all)", "category": "oddity", "title": "Arnold vs the bot", "text": "Arnold reportedly added
