"/Users/felix/Games/mag/src/MATTACK.C:47-60; src/ATTACK.C:75-77"}, {"game": "MAG", "category": "oddity", "title": "Right-handed hero, two-weapon attacks", "text": "Your hero is right-handed: weapons in the left hand are -3 to hit, and you can fight with two weapons at once (each hand rolls separately; \"You hit the X twice!\"). A staff of striking in hand adds +2 to hit and 6+d4 damage but may spend a charge (1 in 15).", "source": "/Users/felix/Games/mag/src/ATTACK.C:63-113"}, {"game": "MAG", "category": "oddity", "title": "Guarding stairs", "text": "A monster that steps on a staircase out of your room may decide (50%) to become paralysed and sleep there, guarding it; attacking or hitting it with a missile wakes it.", "source": "/Users/felix/Games/mag/src/MONSTER1.C:318-320; src/ATTACK.C:146-148"}, {"game": "MAG", "category": "oddity", "title": "Hasted player slows monsters", "text": "Quaffing haste does not give the hero extra moves: monster speeds are halved instead (\"cheap huh?\" says the source comment).", "source": "/Users/felix/Games/mag/src/MONSTER1.C:124-127"}, {"game": "MAG", "category": "oddity", "title": "Explosions hit ten times", "text": "explode() loops 10 times, applying 2-3 damage to every adjacent monster and to the player on each pass (half frames erase it). It skips d, i, q, y, E and V monsters (fire creatures), making oil flasks and will-o-wisps lethal.", "source": "/Users/felix/Games/mag/src/THROW.C:315-356"}, {"game": "MAG", "category": "oddity", "title": "Level-up and HP", "text": "Experience needed is 100 * 2^(level-1). Each level gives rnd(9)+2 hp; monsters roll rnd(7)+2 per hit die. Mushrooms and potions of raise level can skip levels.", "source": "/Users/felix/Games/mag/src/MISC.C:233-237,257; src/MONSTER2.C:297-306"}, {"game": "MAG", "category": "oddity", "title": "Monster packs and lairs", "text": "Pack monsters have a 1 in 25 chance of starting as a pack or lair of 5-9 members, either all asleep or all awake. Each Imperial Dragon is always asleep; invisixplodes start asleep and invisible.", "source": "/Users/felix/Games/mag/src/MONSTER2.C:262-282; src/MONSTER1.C:37-47"}, {"game": "MAG", "category": "oddity", "title": "Original UNIX heritage disputed", "text": "The README states 1988 DOS, with a 1985 UNIX version per the DOS Games Archive; RogueBasin lists 1988 with a question mark. Source headers read 'Copyright (C) 1986,87,88'.", "source": "/Users/felix/Games/mag/README.md; src/MONSTER.H:3-4; https://www.roguebasin.com/index.php/Mike's_Adventure_Game"}, {"game": "MAG", "category": "combat", "title": "To-hit formula", "text": "Attacker needs d20 + modifiers >= 8 + AC - (HD if HD<=5 else 3+HD/2), with AC clamped 0..25; above 20 the surplus is divided by 3. Monsters use d20 >= needtohit(player AC, HD).", "source": "/Users/felix/Games/mag/src/ATTACK.C:156-174"}, {"game": "MAG", "category": "combat", "title": "Player attack modifiers", "text": "Roll adds ring of fumbling (negative) + dexterity, +4 versus sleeping or paralysed targets, -3 for left hand, plus weapon enchantment. Damage is the weapon dice + wepench + ring of increase/decrease damage + strength bonus, minimum 1.", "source": "/Users/felix/Games/mag/src/ATTACK.C:70-109"}, {"game": "MAG", "category": "combat", "title": "Strength bonus", "text": "Damage bonus is Str-16 for 17-20, 5+(Str-20)/2 above 20, and -(12-Str)/2 below 12.", "source": "/Users/felix/Games/mag/src/ATTACK.C:213-226"}, {"game": "MAG", "category": "combat", "title": "Weapon damage table", "text": "Arrow 1d6, long bow 1d3, bolt 1d6, crossbow 1d3, bullet 1d5, sling 1d3, dagger 2d3, dart 1d6, flail 2d4, hand axe 1d5, long sword 2d5, mace 1d8, boulder 3d10, spear 2d3, two-handed sword 4d4.", "source": "/Users/felix/Games/mag/src/VARS.H:57-58"}, {"game": "MAG", "category": "combat", "title": "Dice roller", "text": "damage(\"3d4\") reads only a single digit for the dice count and rolls rnd(sides)+1 per die; multi-attack monsters list attacks separated by '/', e.g. Imperial Dragon \"1d8/2d8/9d3\".", "source": "/Users/felix/Games/mag/src/ATTACK.C:180-207"}, {"game": "MAG", "category": "combat", "title": "Armor class values", "text": "Armor AC: banded 6, chain 5, coconut 5, leather 2, padded 1, plate 7, ring 3, scale 4, splint 6, studded 3; shields: buckler 1, medium 1, great 2, mithril 3.", "source": "/Users/felix/Games/mag/src/VARS.H:71-72"}, {"game": "MAG", "category": "combat", "title": "Speed system", "text": "Normal speed is 5. Speed >=5 gives a move per turn; below 5 gives a rnd(5)<speed chance. Wyvern is 10 (two moves), unicorn 9, zephyr/panther/fire drake 7, babbler and golem 3, invisixplode 1, lizard man 2. A very slow adjacent monster still gets a defensive swing.", "source": "/Users/felix/Games/mag/src/MONSTER.H; src/MONSTER1.C:153-177"}, {"game": "MAG", "category": "combat", "title": "Missiles and bows", "text": "Arrows fly 10+rnd(6) squares only if a long bow is in the right hand (likewise bolts/crossbow, bullets/sling); otherwise 3+rnd(3). Bow enchantments add to hit and damage. Missed missiles may ricochet in a random direction (50%) and wake the target. 4 in 5 hits leave the missile in the monster's inventory.", "source": "/Users/felix/Games/mag/src/THROW.C:50-61,105-150,209-224"}, {"game": "MAG", "category": "combat", "title": "Secondary weapon and swap", "text": "A secondary weapon can be designated and swapped with the x command, which is how the bow is brought up. You can even throw the secondary weapon.", "source": "/Users/felix/Games/mag/src/THROW.C:37-39; src/COMMAND3.C:323"}, {"game": "MAG", "category": "combat", "title": "Trap damage", "text": "Pendulum: rnd(5)+5+dungeon level, avoided if rnd(20) <= your level; poison needle rnd(5)+5 plus Str loss; bear trap rnd(6)+1 and held 5-10 turns; spear trap throws a spear from the wall up to 80 squares away; spider web, strangle weed, sleeping gas, stun and teleport traps also exist. Monsters spring them too.", "source": "/Users/felix/Games/mag/src/TRAP.C:105-358; src/VARS.H:23-33"}, {"game": "MAG", "category": "combat", "title": "Special dragon breath", "text": "Red/Imperial dragons breathe fire, white dragon and crystalizer/frost fiend frost, blue dragon lightning, zabloron magic missile (only 1 in 2 attempts), fire drake fire 1 in 5; any other zapper picks a random wand effect.", "source": "/Users/felix/Games/mag/src/MATTACK.C (specact)"}, {"game": "MAG", "category": "combat", "title": "Wand of lightning vs. golem and lich", "text": "Lightning does 5d6. Golems take negative damage (healed by dam/4 and \"seem to grow even larger (and meaner too!)\"), liches ignore it. Hitting a golem has a 1 in 3 chance of making it berserk (speeded).", "source": "/Users/felix/Games/mag/src/WAND.C:388-402; src/ATTACK.C:134-137"}, {"game": "UltraRogue", "category": "flavour", "title": "Gods who answer prayers", "text": "The p command rolls 0-100 and names the god: Aule (Lord of Crafts), Orome (Lord of Forests), Hermes (Winged Messenger), Lorien (Master of Dreams/Illusion), Este (Lady of Healing), Thor, then \"Boccob, the Uncaring, ignores you.\" for 40-59; bad results from Jubilex, Sauron, Orcus, Incabulos, Raxivort and Morgoth; 90-99 \"You fall into a horrible trance-like state.\"", "source": "/Users/felix/Games/urogue/player.c:21-260"}, {"game": "UltraRogue", "category": "flavour", "title": "Prayer jackpot and disaster", "text": "Roll 0: \"The heavens open and glorious radiance surrounds you!\" with full HP/power and a bolt of eldritch energy on adjacent monsters (up to 8 if godly). Roll 100: \"A bolt of eldritch energy strikes you!\" halving HP and \"The gods must be angry with you.\"", "source": "/Users/felix/Games/urogue/player.c:98-117,215-230"}, {"game": "UltraRogue", "category": "flavour", "title": "Praying costs luck", "text": "Each prayer opens \"You are surrounded by orange smoke...\" and 1 in 3 times costs a point of luck. Praying more times than your level asks \"Are you sure you want to bother the gods?\" and adds +50 to the roll (bad). A ring of piety halves that counter growth.", "source": "/Users/felix/Games/urogue/player.c:43-75,98"}, {"game": "UltraRogue", "category": "flavour", "title": "Artifact curse messages", "text": "Applying artifacts can trigger side effects such as \"You develop some acne on your face.\", \"A wart grows on the end of your nose.\", \"Your toes fall off.\", \"You grow an extra thumb.\", \"An eye grows on your forehead.\", \"A pixie appears and grabs gold from your purse.\", \"You feel Lady Luck is looking the other way.\" and \"You feel in touch with a Universal Oneness.\"", "source": "/Users/felix/Games/urogue/artifact.c:180-660"}, {"game": "UltraRogue", "category": "flavour", "title": "Wand of Yendor can slip", "text": "Using the Wand of Yendor or Sceptre of Might sometimes prints \"Your finger slips.\" and fires a random wand effect instead of your choice.", "source": "/Users/felix/Games/urogue/artifact.c:1518,1640"}, {"game": "UltraRogue", "category": "flavour", "title": "Combat verbs", "text": "Hit messages include \"counted coup on\", \"drew blood from\", \"nearly decapitate\", \"deal a wacking great blow to\"; misses include \"wildly windmill around\" and \"almost fumble while missing\".", "source": "/Users/felix/Games/urogue/fight.c:1585-1640"}, {"game": "UltraRogue", "category": "flavour", "title": "Flea market closes", "text": "The trading post says \"The market is closed. The stairs are that-a-way.\" once you hit your transaction cap (a ring of adornment adds 4 more). Adornment itself is worth 10,000 gold but does nothing else.", "source": "/Users/felix/Games/urogue/trader.c:668-672; init.c:395"}, {"game": "UltraRogue", "category": "flavour", "title": "Class disapproval", "text": "Clerics, druids and paladins wearing armour get \"Your god strongly disapproves of your wearing that!\"; casters with the wrong weapon: \"Your god looks askance at the weapon you wield.\"; thieves: \"Don't expect to be stealthy while wearing that!\"", "source": "/Users/felix/Games/urogue/armor.c:185-205; magic.c:370-385"}, {"game": "UltraRogue", "category": "flavour", "title": "Cause-of-death tombstone strings", "text": "Death causes include \"slow boiling in oil\", \"a botched spell\", \"divine retribution\", \"excessive clumsyness\", \"a parasite\", \"a cursed potion\" and \"an artifact of the gods\".", "source": "/Users/felix/Games/urogue/rip.c:520-560"}, {"game": "UltraRogue", "category": "unique", "title": "Eight artifacts", "text": "Magic Purse of Yendor (L15), Phial of Galadriel (L20), Amulet of Yendor (L25), Palantir of Might (L30), Crown of Might (L35), Sceptre of Might (L40), Silmaril of Ea (L45), Wand of Yendor (L50); worth 4,600 up to 80,000 gp. The README (written for a 100-level dungeon) says the last is on level 100 and warns \"the above may be incorrect\".", "source": "/Users/felix/Games/urogue/init.c:586-595; README"}, {"game": "UltraRogue", "category": "unique", "title": "Lucifer waits on the way up", "text": "Carrying any artifact while arriving on level 1 spawns \"Lord of All Darkness (Lucifer)\": HP 18d60+700, AC -13, attacks 3d8/3d8/3d8, 1,465,000 exp, can walk through walls, summons evil sorcerers. The history file records him being repeatedly nerfed and buffed.", "source": "/Users/felix/Games/urogue/newlvl.c:128-129,647-670; monsdata.c:2870-2876; history.txt:273-380"}, {"game": "UltraRogue", "category": "unique", "title": "A pantheon of monsters", "text": "The table has ~406 monsters including D&D deities and Tolkien powers: Boccob, Istus, Olidammara, Odin, Ralishaz, Zagyg the Unpredictable (some annotated \"Dragon #70\" for the Dragon magazine issue), plus valar Orome, Aule, Ulmo, Melkor, Manwe and Tulkas (whose summon field reads \"noone, haste anyway\").", "source": "/Users/felix/Games/urogue/monsdata.c:2548,2653,2779-2870"}, {"game": "UltraRogue", "category": "unique", "title": "Phial of Galadriel", "text": "Applying it offers total healing (raising max HP and power by rnd(level)+1) or total monster confusion; even uniques get a magic save. newlvl.c also prints \"The Phial banishes the darkness!\" on level entry.", "source": "/Users/felix/Games/urogue/artifact.c:1052-1119; newlvl.c:343"}, {"game": "UltraRogue", "category": "unique", "title": "Amulet of Yendor is meek", "text": "The Amulet only offers level evaluation (plus invisibility on some rolls); the glamour is the Wand and Sceptre. The Crown of Might gives permanent +/- ability changes.", "source": "/Users/felix/Games/urogue/artifact.c:1282-1345,1671-1860"}, {"game": "UltraRogue", "category": "unique", "title": "Rings and class items", "text": "Ten rings can be worn at once (\"You already have on ten rings.\"). Rare rings include wizardry, piety, resurrection, teleport control, true sight and adornment.", "source": "/Users/felix/Games/urogue/rings.c:66-72; init.c:370-407"}, {"game": "UltraRogue", "category": "unique", "title": "Crysknife and poison", "text": "The crysknife (3d3) is poisonous: a failed poison save halves the monster's HP (damage at least hp/2+5). Silver weapons hit unless the target saves vs magic and do double to undead.", "source": "/Users/felix/Games/urogue/init.c:546; fight.c:1459-1492; history.txt:130"}, {"game": "UltraRogue", "category": "unique", "title": "Spell lists by class", "text": "Eleven character classes: Fighter, Magician, Cleric, Thief, Paladin, Ranger, Druid, Illusionist, Assassin, Ninja, plus Monster. Spells are learned from potion/scroll/wand effects with flags SP_DRUID, SP_MAGIC, SP_CLERIC, SP_ILLUSION, SP_WIZARD, SP_PRAYER.", "source": "/Users/felix/Games/urogue/fight.c:43-58; magic.c:77-140; getplay.c:308-340; README"}, {"game": "UltraRogue", "category": "unique", "title": "Disguised monsters", "text": "Monsters flagged ISDISGUISE masquerade as items; once the level exceeds the first artifact level (15) the disguise roll can also pick the ARTIFACT symbol.", "source": "/Users/felix/Games/urogue/monsters.c:539-557"}, {"game": "UltraRogue", "category": "unique", "title": "Ulodyte, wuccubi, kittyhawk", "text": "Odd monster names include \"wuccubi\", \"ulodyte\", \"heffalump\" (3d10/3d10/2d8 trampler), \"kittyhawk\" with six attacks (1d2 x3, 1d3 x3), \"coachman of death\", \"silver cloud\", \"blue pool horror\", and numerous succubi each \"Servant of\" a named demon.", "source": "/Users/felix/Games/urogue/monsdata.c:1484,1750,2219-2239"}, {"game": "UltraRogue", "category": "oddity", "title": "Death has a 1 in 67 reprieve", "text": "Even without a ring, every death has a 1/67 chance (1/3 in wizard mode) to trigger the resurrection routine, using one of s_const lives set at game start. Ring of resurrection forces it.", "source": "/Users/felix/Games/urogue/rip.c:70-90; main.c:190"}, {"game": "UltraRogue", "category": "oddity", "title": "Teleporting items on resurrection", "text": "On a resurrection your unowned, unprotected pack items are scattered to random floor spots on the level, artifacts drop out of your artifact flags, and your CON is cut.", "source": "/Users/felix/Games/urogue/rip.c:88-135"}, {"game": "UltraRogue", "category": "oddity", "title": "Fight until a third", "text": "do_fight refuses to continue automatically when you are below a third of max HP unless you fight 'to the death'; history lists this change dated Feb 13/85.", "source": "/Users/felix/Games/urogue/fight.c:61-88; history.txt (1.00 Alpha Feb 13/85, item 8)"}, {"game": "UltraRogue", "category": "oddity", "title": "History of nerfs and a 100-level dungeon", "text": "Version 1.06 (1995) cut the dungeon from 100 to 50 levels \"so that monsters get harder faster\"; Herb Chong wrote he could reach \"about level 20 or so most times I play it\". The Jan 6/85 log moved the amulet to level 50 \"for safety\".", "source": "/Users/felix/Games/urogue/history.txt:1440-1469,36-39"}, {"game": "UltraRogue", "category": "oddity", "title": "Origins", "text": "Chong started on Dec 17, 1984 and renamed the game UltraRogue on Jan 15, 1985 (\"hopefully, it will live up to it's name\"). It descends from Rogue 3.6 and Advanced Rogue. Copyright 1985, 1986, 1992, 1993, 1995; 1.04 (Oct 24, 1992) updated it for ANSI C.", "source": "/Users/felix/Games/urogue/history.txt:11,129-143,1430-1440; README; https://rlgallery.org/notes/urogue-versions.html"}, {"game": "UltraRogue", "category": "oddity", "title": "Artifact activation gamble", "text": "Applying an artifact first rolls rnd(100)-10*rnd(luck): under 5 triggers a major malevolent effect, under 50 a minor one, otherwise it activates. The major table can crumble your weapon or armour, lock you in a throne room, or turn on SUPEREAT.", "source": "/Users/felix/Games/urogue/artifact.c:30-45,842-1045"}, {"game": "UltraRogue", "category": "oddity", "title": "Ring of delusion, nothing items", "text": "Scroll and wand 'of nothing' exist with high cursed odds; potions of 'disguise' and rings of 'delusion', 'carrying' (pack weighs 1/3 less) are in the tables.", "source": "/Users/felix/Games/urogue/init.c:330,361,393-394,430"}, {"game": "UltraRogue", "category": "combat", "title": "To-hit swing()", "text": "d20+1 plus modifiers must reach base - factor*((min(level,max_lvl)-offset)/range) + (10 - AC); a need of 21-25 is clamped to 20 so a natural 20 still hits tough armor. Fighters, paladins, rangers use base 10, max level 17; magicians and illusionists base 9; the monster class base 7.", "source": "/Users/felix/Games/urogue/fight.c:43-58,1216-1232"}, {"game": "UltraRogue", "category": "combat", "title": "Saving throws", "text": "need = 14 + type - level/2 - ring of protection - armour bonus - class bonus (paladins +2); mithril gives +5 against magic and wands; 1 always fails and 20 always saves.", "source": "/Users/felix/Games/urogue/fight.c:1648-1688"}, {"game": "UltraRogue", "category": "combat", "title": "Class damage bonuses", "text": "Rangers do +1 per level against large monsters; ninjas +level/2 on every hit; fighters stun anything they hit for more than a third of its max HP (1-4 extra moves lost); thieves, ninjas and assassins backstab sleeping targets for x(level/4 + 2).", "source": "/Users/felix/Games/urogue/fight.c:1442-1556"}, {"game": "UltraRogue", "category": "combat", "title": "Half damage and immunities", "text": "Half-damage monsters take half; fireproof ones take 0 from CANBURN weapons; NOMETAL, NOSHARP ones take 0 from metal/sharp weapons; BLOWDIVIDE monsters split instead of dying (1 in 3), but not against burning weapons.", "source": "/Users/felix/Games/urogue/fight.c:1450-1500"}, {"game": "UltraRogue", "category": "combat", "title": "Flaming arrows and silver", "text": "Silver arrows (2d8) are 'aimed by magic' and miss only if the target saves; fire arrows burn; burning oil thrown at a monster explodes and monsters that divide will not do so when hit by burning oil.", "source": "/Users/felix/Games/urogue/init.c:473-480,513; history.txt:62-66,114-117"}];
const CATS=[['flavour','Flavour text'],['unique','Unique things'],['oddity','Oddities & history'],['combat','Combat system']];
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let cat='',game='';
$('tabs').innerHTML=[['','All']].concat(CATS).map(([k,t])=>`<button class="tab" data-k="${k}">${t}</button>`).join('');
$('gs').innerHTML='<option value="">All games</option>'+[...new Set(D.map(e=>e.game))].sort().map(g=>`<option>${esc(g)}</option>`).join('');
const link=s=>/^https?:/.test(s)?`<a href="${esc(s)}" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/,''))}</a>`:esc(s);
function render(){
  const q=$('q').value.toLowerCase(),L=D.filter(e=>(!cat||e.category===cat)&&(!game||e.game===game)&&(e.title+' '+e.text+' '+e.game).toLowerCase().includes(q));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cat));
  $('cnt').textContent=L.length+' entries';
  $('out').innerHTML=(cat?[CATS.find(c=>c[0]===cat)]:CATS).map(([k,t])=>{const s=L.filter(e=>e.category===k);return s.length?`<section><h2>${t}<span>${s.length}</span></h2><div class="grid">${s.map(e=>`<div class="card"><h3><b>${esc(e.game)}</b>${esc(e.title)}</h3><p>${esc(e.text)}</p><div class="src">${link(e.source)}</div></div>`).join('')}</div></section>`:''}).join('')||'<p class="sub">Nothing found.</p>';
}
$('tabs').onclick=e=>{if(e.target.dataset.k!==undefined){cat=e.target.dataset.k;render()}};
$('q').oninput=render;$('gs').onchange=e=>{game=e.target.value;render()};
render();
</script></body></html>
