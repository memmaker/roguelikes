 features specifically to break Rog-O-Matic's play in later versions.", "source": "https://handwiki.org/wiki/Software:Rogue_(video_game)"}, {"game": "Family", "category": "oddity", "title": "Rog-O-Matic", "text": "In 1981 four CMU grad students (Appel, Hamey, Jacobson, Mauldin) built a bot that reads Rogue's ASCII screen. In 1983 tests it beat 15 top human players on median score and retrieved the Amulet from level 26 and reached the surface.", "source": "https://en.wikipedia.org/wiki/Rog-O-Matic"}, {"game": "Family", "category": "oddity", "title": "Hack: refused source", "text": "Hack's authors (Lincoln-Sudbury high school students Fenlason, Woodland, Thome, Payne) saw Rogue at Berkeley, were refused the source, and wrote their own dungeon routines. The name Hack refers both to hack-and-slash and the programming workaround.", "source": "https://en.wikipedia.org/wiki/NetHack"}, {"game": "Family", "category": "oddity", "title": "Hack to NetHack", "text": "Andries Brouwer expanded Hack and posted it to Usenet in 1984-85; Mike Stephenson then forked it as NetHack, 'Net' for the internet collaboration, first released in 1987.", "source": "https://nethackwiki.com/wiki/Hack"}, {"game": "NetHack", "category": "unique", "title": "Rogue level tribute", "text": "NetHack has a Rogue-style level (about levels 15-18) with letter monsters, '%' stairs and ':' food. A ghost named after Toy, Arnold or Wichman guards a fake bones pile with a 50% chance of a fake Amulet.", "source": "https://nethackwiki.com/wiki/Rogue_level"}, {"game": "Family", "category": "oddity", "title": "Moria", "text": "Robert Koeneke wrote Moria at Oklahoma in VMS BASIC then Pascal after losing access to Rogue on a new VAX; it added a town level for shopping. Umoria came in 1987 and Moria influenced Angband and Diablo.", "source": "https://en.wikipedia.org/wiki/Moria_(1983_video_game)"}, {"game": "Larn", "category": "oddity", "title": "Larn", "text": "Noah Morgan's 1986 Larn was influenced by Rogue, adds a town connected to multiple dungeons, a bank, a time limit to cure your daughter, and always-successful identification.", "source": "https://www.roguebasin.com/index.php/Larn"}, {"game": "Rogue (all)", "category": "oddity", "title": "Rogue Clone", "text": "Tim Stoehr started Rogue Clone in 1986 because of licensing issues with the original; versions I-III were Unix, IV is the DOS/Windows version.", "source": "https://www.roguebasin.com/index.php/Rogue_Clone"}, {"game": "Super-Rogue", "category": "oddity", "title": "Super-Rogue", "text": "Created by AT&T Bell Labs employees in 1982-83 from Rogue 3.6, publicly fronted by Robert Kindelberger, with versions 6.5 to 9.0; source was released publicly only in 2004.", "source": "https://www.roguebasin.com/index.php/Super-Rogue"}, {"game": "Advanced Rogue 7.7", "category": "oddity", "title": "Advanced Rogue", "text": "Also from AT&T Bell Labs (Michael Morgan, Ken Dalka and others, 1984-85), based on Rogue 3.6 with Super-Rogue additions; version 5.8s has special rooms such as orc den, ant hill, throne room and zoo.", "source": "https://www.roguebasin.com/index.php/Advanced_Rogue"}, {"game": "UltraRogue", "category": "oddity", "title": "UltraRogue", "text": "Herb Chong's 1985-86 fork has hundreds of monsters, classes and eight artifacts across 100 levels (first artifact around level 25). The urogue DOS port labelled 2.0 is unexplained; Chong never called anything UltraRogue 2.0.", "source": "https://rlgallery.org/notes/urogue-versions.html"}, {"game": "UltraRogue", "category": "flavour", "title": "It's like knitting", "text": "One player says UltraRogue is easy until about level 20 then brutal, and that winning isn't the point: it's like knitting.", "source": "https://tleaves.com/2005/04/13/ultrarogue/index.html"}, {"game": "XRogue", "category": "oddity", "title": "XRogue", "text": "Robert Pietkivitch built XRogue (1989-92) on Advanced Rogue 7.x for the AT&T UNIX PC; his 2000 update was lost after his death in 2002, and Gibbon revived it as 8.0.5 in 2015.", "source": "https://www.roguebasin.com/index.php/XRogue"}, {"game": "Family", "category": "oddity", "title": "Reunion", "text": "Toy, Wichman and Arnold appeared together onstage for the first time in about 30 years at the 2016 Roguelike Celebration in San Francisco.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Ken Arnold wizard mode", "text": "Entering wizard mode (^P) with the right password says \"You are suddenly as smart as Ken Arnold in dungeon #%d\"; leaving says \"Not wizard any more\". Rogue 5.4 keeps the line (lowercased).", "source": "rogue3.6/command.c:218; rogue5.4/command.c:348"}, {"game": "Rogue (all)", "category": "flavour", "title": "Mctesq was here", "text": "The version command prints \"Rogue version %s. (mctesq was here)\" in 3.6; 5.4 prints \"version %s. (mctesq was here)\" and Rogue PC \"Rogue version %d.%d (Mr. Mctesq was here)\".", "source": "rogue3.6/command.c:193; rogue5.4/command.c:309; roguepc/src/command.c:260"}, {"game": "Rogue PC", "category": "flavour", "title": "jll was here", "text": "Rogue PC's redraw key (^L) prints \"the screen looks fine to me (jll was here)\", and the options key 'o' answers \"i don't have any options, oh my!\".", "source": "roguepc/src/command.c:276-279"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Shell escape denied", "text": "The '!' command in 3.6 answers \"There is no shell here.\" The same line survives in 5.4 (lowercase).", "source": "rogue3.6/command.c:145; rogue5.4/command.c:194"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Load average nagging", "text": "Rogue 3.6 was written for shared Unix machines: if the system load average is too high it warns \"The load is too high to be playing.  Please leave in %d minutes\", then \"Please save your game...\", \"Last warning...\", and finally kills the game with \"Sorry.  You took to long.  You are dead\". If the load drops: \"The load has dropped back down.  You have a reprieve.\"", "source": "rogue3.6/main.c:420-448"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Tombstone with 10% burial tax", "text": "On death the 3.6 tombstone shows REST IN PEACE, your name, your gold as \"%d Au\", \"killed by a\" and the year (hard-coded template text says 1980). Before printing, death() does purse -= purse/10, so the tombstone gold (and score) is 10% less than what you carried.", "source": "rogue3.6/rip.c:27-39,66"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Killed by an arrow, dart or bolt", "text": "Non-monster killers are single letters: 'a' arrow, 'd' dart, 'b' bolt, and the tombstone prints \"killed by a(n) arrow\" etc. 5.4 adds 'h' hypothermia and 's' starvation; PC adds 'f' fall.", "source": "rogue3.6/rip.c:396-409; rogue5.4/rip.c:403-407; roguepc/src/rip.c:476-495"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Typos preserved in the victory screen", "text": "3.6 itemised winner screen prints \"Gold Peices\" (misspelled). 5.4 corrected it to \"Gold Pieces\".", "source": "rogue3.6/rip.c:387; rogue5.4/rip.c:385"}, {"game": "Rogue (all)", "category": "flavour", "title": "Winner text", "text": "Winning: \"Congratulations, you have made it to the light of day!\" ... \"You journey home and sell all your loot at a great profit and are admitted to the fighters guild.\" (3.6, PC lowercase 'fighters guild'; 5.4 'Fighters' Guild').", "source": "rogue3.6/rip.c:303-307; rogue5.4/rip.c:314-318; roguepc/src/rip.c:363-367"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Scroll of enchant weapon, no weapon", "text": "Reading enchant weapon while bare-handed prints \"You feel a strange sense of loss.\" (5.4 uses the same line for enchant armor, enchant weapon, and protect armor with nothing to affect). Reading it with a weapon: \"Your %s glows blue for a moment.\"", "source": "rogue3.6/scrolls.c:245-253; rogue5.4/scrolls.c:102,264,303"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Create monster failing", "text": "If a create-monster scroll finds no free square: \"You hear a faint cry of anguish in the distance.\"", "source": "rogue3.6/scrolls.c:149"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Aggravate / remove curse / teleport lines", "text": "Aggravate monsters: \"You hear a high pitched humming noise.\" Remove curse: \"You feel as if somebody is watching over you.\" Scare monster read: \"You hear maniacal laughter in the distance.\" Blank paper: \"This scroll seems to be blank.\" Unknown: \"What a puzzling scroll!\"", "source": "rogue3.6/scrolls.c:261-286"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Scroll of gold detection", "text": "Gold detection: \"You begin to feel greedy and you sense gold.--More--\"; with no gold on the level: \"You begin to feel a pull downward\". Removed from 5.x (replaced by food detection: \"Your nose tingles and you smell food.\"/\"your nose tingles\").", "source": "rogue3.6/scrolls.c:218-227; rogue5.4/scrolls.c:240-250"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Potion messages", "text": "Confusion: \"Wait, what's going on here. Huh? What? Who?\" Healing: \"You begin to feel better.\" Extra healing: \"You begin to feel much better.\" Raise level: \"You suddenly feel much more skillful\". Blindness: \"A cloak of darkness falls around you.\" Restore strength: \"Hey, this tastes great.  It make you feel warm all over.\" (grammar slip preserved in 5.4). Thirst quenching: \"This potion tastes extremely dull.\" See invisible: \"This potion tastes like %s juice.\" (your fruit option).", "source": "rogue3.6/potions.c:51-183; rogue5.4/potions.c:205"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Fruit option default slime-mold", "text": "The 'fruit' option names the second food item; default is \"slime-mold\" (also used in See Invisible: \"tastes like slime-mold juice\" and \"My, that was a yummy slime-mold\"). Food rations: 3.6 shows \"Some food\" / \"%d rations of food\".", "source": "rogue3.6/main.c:82-89; misc.c:243"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Eating messages", "text": "Eating a ration: 70% \"Yum, that tasted good\", 30% \"Yuk, this food tastes awful\" and the awful meal gives +1 experience point (check_level called).", "source": "rogue3.6/misc.c:245-252"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Hunger messages", "text": "\"You are starting to get hungry\" (terse: \"Getting hungry\"), \"You are starting to feel weak\", then fainting \"You feel too weak from lack of food.  You faint\". Terse mode abbreviates every message.", "source": "rogue3.6/daemons.c:150-175"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Trap messages", "text": "Trap door: \"You fell into a trap!\" Bear trap: \"You are caught in a bear trap\" / \"You are still stuck in the bear trap\". Sleep: \"A strange white mist envelops you and you fall asleep\". Arrow: \"Oh no! An arrow shot you\" / \"An arrow shoots past you.\" Dart: \"A small dart just hit you in the shoulder\" / \"...whizzes by your ear and vanishes.\"", "source": "rogue3.6/move.c:254-303"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Wand of missile 'schtick'", "text": "The default case in the wand code prints \"What a bizarre schtick!\" (kept in 5.4). The missile bolt also reads \"The missile vanishes with a puff of smoke\"; 5.4 and PC misspell this \"missle\".", "source": "rogue3.6/sticks.c:340; rogue5.4/sticks.c:189-191; roguepc/src/sticks.c:219"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Mimic reveal", "text": "Attacking an undisguised-looking mimic gives \"Wait! That's a mimic!\" and wastes your attack. A mimic is disguised as gold, potion, scroll, stairs, weapon, armor, ring or stick (and the Amulet below level 25). Rogue PC and 5.x replace mimic with xeroc: \"wait! That's a Xeroc!\" (PC) and 5.4 uses rnd_thing() as the disguise.", "source": "rogue3.6/fight.c:53-57, monsters.c:77-94; roguepc/src/fight.c:38; rogue5.4/monsters.c:88"}, {"game": "Rogue 3.6", "category": "flavour", "title": "Spellings: saphire, cinnibar, kryptonite", "text": "3.6 ring gems include \"saphire\" (sic), \"kryptonite\" and \"lapus lazuli\"; woods include \"cinnibar\" (sic) \"zebra wood\" and \"avocado wood\"; metals include \"aluminium\". 5.4 corrects sapphire/lapis but keeps cinnibar and adds stibotantalite, taaffeite, germanium and a gem value per stone.", "source": "rogue3.6/init.c:100-170; rogue5.4/init.c:~120-170"}, {"game": "Rogue 3.6", "category": "flavour", "title": "24 colours, pink and plaid", "text": "Potion colours (24): red, blue, green, yellow, black, brown, orange, pink, purple, grey, white, silver, gold, violet, clear, vermilion, ecru, turquoise, magenta, amber, topaz, plaid, tan, tangerine. 5.4 has 27 (adds aquamarine, crimson, cyan) and uses them for hallucination-only trap messages.", "source": "rogue3.6/init.c:68-92; rogue5.4/init.c:81-110"}, {"game": "Rogue 5.4", "category": "flavour", "title": "Hallucination wording swaps", "text": "5.4 choose_str() swaps messages while hallucinating: \"you feel less trippy now\", \"the munchies overpower your motor capabilities\", \"You freak out\", \"bummer!  You've hit the ground\", \"you feel in touch with the Universal Onenes\" (sic) for remove curse, \"Everything looks SO boring now.\" when it ends.", "source": "rogue5.4/daemons.c:87-294; scrolls.c:286"}, {"game": "Rogue 5.4", "category": "flavour", "title": "Magic trap (mysterious trap) menu", "text": "The 5.4 magic trap picks from 11 messages: \"you are suddenly in a parallel dimension\", \"a spike shoots past your ear!\", \"you feel time speed up suddenly\", \"time now seems to be going slower\", \"you suddenly feel very thirsty\", \"you pack turns <colour>!\" (typo 'you pack'), and so on; only some have an effect. 3.6 has no such trap.", "source": "rogue5.4/move.c:287-300"}, {"game": "Rogue 5.4", "category": "flavour", "title": "Rust trap", "text": "5.4 adds \"a rust trap\": \"a gush of water hits you on the head\", then rust_armor(). 3.6 trap list: trap door, arrow, sleeping gas, bear, teleport, dart.", "source": "rogue5.4/move.c:349-350"}, {"game": "Rogue PC", "category": "flavour", "title": "Scoreboard 'wierded out'", "text": "Rogue PC's Hall of Fame is \"Guildmaster's Hall Of Fame:\"; entries read \"killed by X\", \"quit\", \" Honored by the Guild\" for depth 26+, and \"wierded out\" (sic) for odd deaths; wins read \" A total winner!\".", "source": "roguepc/src/rip.c:148-196"}, {"game": "Rogue PC", "category": "flavour", "title": "Potion of monster detection ad", "text": "In the DEMO build the monster detection potion is replaced by \"advertisement\": \"you can't move and are forced to watch this advertisement\" / \"rogue: The ULTIMATE Adventure Game\" / \"the most popular game on UNIX ever!\" / \"now runs on YOUR IBM PC\" / \"UNIX is a trademark of Bell Labs\".", "source": "roguepc/src/potions.c:97-103; extern.c:95-100"}, {"game": "Rogue PC", "category": "flavour", "title": "The crack widens", "text": "In Rogue PC, if the hero is somehow in a place that belongs to no room or passage (roomin sets bailout), the next move prints \"the crack widens ... \" and drops you down one level. Related debug messages: \"wanderer bailout\", \"treasure rm bailout\".", "source": "roguepc/src/move.c:42-46; chase.c:365"}, {"game": "Rogue PC", "category": "flavour", "title": "Expert mode toggle", "text": "^T toggles \"Ok, I'll be brief\" / \"Goodie, I can use big words again!\" (expert flag shortens messages); also gives \"you hear maniacal laughter\" without \"in the distance\".", "source": "roguepc/src/command.c:250-253; scrolls.c:191"}, {"game": "Rogue 3.6", "category": "unique", "title": "Monster alphabet A-Z (3.6)", "text": "3.6 roster: giant ant, bat, centaur, dragon, floating eye, violet fungi, gnome, hobgoblin, invisible stalker, jackal, kobold, leprechaun, mimic, nymph, orc, purple worm, quasit, rust monster, snake, troll, umber hulk, vampire, wraith, xorn, yeti, zombie. 5.4 renames/replaces: aquator, emu, venus flytrap, griffin, ice monster, jabberwock, kestrel, medusa, phantom, quagga, rattlesnake, black unicorn, xeroc; PC has slime and ur-vile.", "source": "rogue3.6/init.c:78-106; rogue5.4/extern.c:190-221; roguepc/src/extern.c:424-455"}, {"game": "Rogue 3.6", "category": "unique", "title": "Amulet changes hunger and stairs", "text": "Carrying the Amulet cancels normal digestion in 3.6/5.4 (food_left -= ... + 1 - amulet), so only ring effects eat food. Going up stairs only works if you hold the Amulet; arriving gives \"You feel a wrenching sensation in your gut.\" Rogue PC has no 'amulet' term in stomach().", "source": "rogue3.6/daemons.c:161; command.c:549-556; rogue5.4/daemons.c:163"}, {"game": "Rogue 3.6", "category": "unique", "title": "No more gold once you have the Amulet", "text": "After you pick up the Amulet, levels above max_level no longer get new items or gold: \"the only way to get new stuff is go down into the dungeon\".", "source": "rogue3.6/newlevel.c:126-129; rooms.c:85"}, {"game": "Rogue 3.6", "category": "unique", "title": "Floating eye hypnosis", "text": "A floating eye's gaze (3.6) freezes you: \"You are transfixed by the gaze of the floating eye.\" for rnd(2)+2 turns per hit; if you stay frozen over 100 turns while starving, you die 'killed by a floating eye'. It never does damage (\"0d0\"). 5.4 replaces it with the ice monster: \"you are frozen by the ice monster\"; death by it with BORE_LEVEL 50 is \"hypothermia\".", "source": "rogue3.6/fight.c:135-146; rogue5.4/fight.c:197-211"}, {"game": "Rogue 3.6", "category": "unique", "title": "Rust monster vs aquator", "text": "3.6 rust monster ('R') hit: \"Your armor appears to be weaker now. Oh my!\" (AC +1 up to 9). 5.4 aquator ('A') does the same but leather armor is immune, and rings of maintain armor / protect armor scroll stop it: \"the rust vanishes instantly\". Rogue PC also exempts leather.", "source": "rogue3.6/fight.c:128-137; rogue5.4/move.c:400-424; roguepc/src/fight.c:112-125"}, {"game": "Rogue 3.6", "category": "unique", "title": "Violet fungi per-hit damage", "text": "Violet fungi (F) hold you (ISHELD) and each successful hit raises its damage dice one step: damage string is rewritten to \"%dd1\" with ++fung_hit (1d1, 2d1, 3d1...). Missing also costs you fung_hit. Killing it resets the counter. 5.4 renames it venus flytrap and writes \"%dx1\".", "source": "rogue3.6/fight.c:197-201,270-278; rogue5.4/fight.c:243-250"}, {"game": "Rogue 3.6", "category": "unique", "title": "Nymph steals a magic item", "text": "A nymph (3.6/5.4) steals a random magic item you aren't wearing/wielding (equipped items are exempt): \"She stole %s!\" (5.4: \"she stole %s!\") and disappears. Leprechaun steals gold \"Your purse feels lighter\" and also vanishes.", "source": "rogue3.6/fight.c:224-266; rogue5.4/fight.c:261-277"}, {"game": "Rogue 3.6", "category": "unique", "title": "Wraith drains levels", "text": "Wraith (W) hits drain a level 15% of the time: \"You suddenly feel weaker.\" Level goes down, experience is set to just above the new level's threshold, and max HP drops 1d10. Zero experience = death. In 3.6 vampires do not drain; in 5.4 they steal max HP 30% of the time for 1d3 (PC: 1d5).", "source": "rogue3.6/fight.c:174-199; rogue5.4/fight.c:229-257; roguepc/src/fight.c:152-181"}, {"game": "Rogue 3.6", "category": "unique", "title": "Giant ant poison, rattlesnake bite", "text": "3.6 ant sting: \"You feel a sting in your arm and now feel weaker\" (-1 Str unless saved). 5.4 rattlesnake: \"you feel a bite in your leg and now feel weaker\"; sustain strength ring: \"a bite momentarily weakens you\".", "source": "rogue3.6/fight.c:156-170; rogue5.4/fight.c:212-232"}, {"game": "Rogue 3.6", "category": "unique", "title": "Invisible stalker and bat erratic", "text": "Bats flit randomly 50% of the time, invisible stalkers 20% (and any confused monster 80%). In 5.4: confused 80%, phantom 20%, bat 50%.", "source": "rogue3.6/chase.c:174-175; rogue5.4/chase.c:331-332"}, {"game": "Rogue 5.4", "category": "unique", "title": "Medusa's gaze", "text": "5.4 Medusa confuses you when you see her (unless you save vs magic): \"the medusa's gaze has confused you\" (hallucinating or blind players are immune). It happens once per medusa (ISFOUND flag).", "source": "rogue5.4/monsters.c:184-204"}, {"game": "Rogue 5.4", "category": "unique", "title": "Dragon breath", "text": "5.4 dragons breathe fire: if you are in a straight line within BOLT_LENGTH squared distance and one in DRAGONSHOT(5) chance, it fires a 'flame' bolt. 3.6 dragons have no breath attack (only 1d8/1d8/3d10 melee).", "source": "rogue5.4/chase.c:17,168-177"}, {"game": "Rogue 5.4", "category": "unique", "title": "Deeper than the Amulet = tougher", "text": "5.4 monsters created beyond level 26 get level+1 per level, lower armor, more exp, and from level 30 on all monsters are hasted (ISHASTE).", "source": "rogue5.4/monsters.c:64-86"}, {"game": "Rogue PC", "category": "unique", "title": "Scroll of vorpalize weapon", "text": "PC replaces 3.6's genocide/gold detection with \"vorpalize weapon\" (prob 1, worth 300): weapon gets +1,+1 and a chosen enemy type (+4,+4 against it plus one instant kill zap). Reading it on an already vorpal weapon: \"your %s vanishes in a puff of smoke\". Flash message: \"your %s gives off a flash of intense white light\" when you first see the enemy.", "source": "roguepc/src/scrolls.c:212-260; fight.c:326-332; chase.c:197-205; extern.c:485"}, {"game": "Rogue PC", "category": "unique", "title": "Staff of striking as a weapon", "text": "PC's staff of striking can be wielded: each use burns a charge and when charges run out the damage becomes 0d0 and bonuses are zeroed. 3.6/PC list wand 'striking', 5.4 swaps it for 'invisibility' (priced 5).", "source": "roguepc/src/fight.c:354-361; rogue5.4/extern.c:ws_info"}, {"game": "Rogue 3.6", "category": "unique", "title": "Weapon table (3.6)", "text": "3.6 weapons: mace 2d4 (thrown 1d3), long sword 1d10, long bow, arrow, dagger 1d6, rock, two handed sword 3d6, sling, dart, crossbow, crossbow bolt, spear 1d8. 5.4: mace 2x4, long sword 3x4, short bow, arrow, dagger 1x6, two handed sword 4x4, dart, shuriken, spear 2x3 (rock/sling/crossbow removed). PC: long sword 3d4, 2h 4d4, spear 2d3, crossbow kept.", "source": "rogue3.6/weapons.c:20-47; rogue5.4/weapons.c:20-35; roguepc/src/weapons.c:17-28"}, {"game": "Rogue 5.4", "category": "unique", "title": "Fake weapon slot for dragon breath", "text": "weap_info has a final fake entry commented \"DO NOT REMOVE: fake entry for dragon's breath\", so the dragon's flame bolt can have a 'name' and damage.", "source": "rogue5.4/extern.c:weap_info"}, {"game": "Rogue 3.6", "category": "unique", "title": "18/xx start 1% of the time", "text": "3.6: rnd(100)==7 gives the hero 18/01-18/100 strength at start; otherwise 16. 5.4 always starts at strength 16 (INIT_STATS 16,...).", "source": "rogue3.6/init.c:120-128; rogue5.4/extern.c:INIT_STATS"}, {"game": "Rogue 5.4", "category": "unique", "title": "Scroll of identify splits into five", "text": "5.4 replaces identify with identify potion/scroll/weapon/armor/ring-wand-staff and adds protect armor and food detection; removes gold detection, genocide and blank paper. Potion list: hallucination and levitation replace paralysis and thirst quenching. Ring of maintain armor added.", "source": "rogue5.4/extern.c:pot_info,scr_info,ring_info"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Identify scroll frequency", "text": "3.6: identify is 21 of 100 in the scroll table (highest). Others: light 10, enchant weapon 10, monster confusion 8, enchant armor 8, remove curse 8, teleportation 7, genocide 1, aggravate 1, blank 1. In 5.4 five identify scrolls total 43.", "source": "rogue3.6/init.c:276-293; rogue5.4/extern.c:scr_info"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Item type percentages", "text": "3.6: potion 27, scroll 27, food 18, weapon 9, armor 9, ring 5, stick 5. 5.4: potion 26, scroll 36, food 16, weapon 7, armor 7, ring 4, stick 4. PC: 27/30/17/8/8/5/5.", "source": "rogue3.6/init.c:271-278; rogue5.4/extern.c:224-233; roguepc/src/extern.c:468"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Food luck", "text": "If no food has spawned for more than three item rolls (no_food > 3) the next thing is forced to be food, so food is never starved. 3.6: 89% 'food' / 11% fruit; 5.4: 90/10. Hunger: HUNGERTIME 1300, STOMACHSIZE 2000, MORETIME 150 (weak at <150, hungry at <300).", "source": "rogue3.6/things.c:~278-292; rogue.h:119-121"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Experience table typo", "text": "3.6 e_levels contains 40920 where 40960 would follow the doubling pattern (10,20,40...,20480,40920,81920...). 5.4 uses 1300,2600,5200,13000 at levels 8-11 instead of doubling; PC computes pure doubling 10..2,621,440.", "source": "rogue3.6/fight.c:19-21; rogue5.4/extern.c:124-146; roguepc/src/init.c:461-463"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Strength to-hit and damage bonuses", "text": "3.6 str_plus: 18/100 +3, 18/51+ +2, 17+ +1, 7-16 0, below 7 gives str-7. add_dam: 18/100 +6, 18/91+ +5, 18/76+ +4, 18/01+ +3, 18 +2, 16+ +1, 7-15 0, below 7 str-7.", "source": "rogue3.6/fight.c:543-585"}, {"game": "Rogue 5.4", "category": "oddity", "title": "Plus four to hit sleepers", "text": "5.4 and PC give +4 to hit any creature that is not running (asleep or held). 3.6 has no such bonus.", "source": "rogue5.4/fight.c:440-446; roguepc/src/fight.c:371-374"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Damage list with slashes", "text": "Monster damage is a string like \"1d8/1d8/3d10\": each slash-separated attack rolls separately (dragon claws, claws, bite). 3.6: xorn 1d3/1d3/1d3/4d6; troll 1d8/1d8/2d6; umber hulk 3d4/3d4/2d5; purple worm 2d12/2d4.", "source": "rogue3.6/init.c:78-105; fight.c:405-430"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Doctor daemon (resting)", "text": "HP regen is slow: below level 8 you gain 1 HP once 'quiet' exceeds 20-2*level turns; from level 8 up, after 3 quiet turns you gain rnd(lvl-7)+1. Ring of regeneration adds +1 per ring each turn.", "source": "rogue3.6/daemons.c:17-47"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Ring food costs", "text": "Digestion ring_eat: regeneration costs +2 per turn, sustain strength +1, searching 33% chance +1, slow digestion 50% chance -1. Amulet gives +1 (cancels). In 3.6, no death by plain starvation exists; you faint 20% of turns. 5.4 and PC kill you at -850 food (STARVETIME) 'killed by starvation'.", "source": "rogue3.6/rings.c:172-189; daemons.c:130-175; rogue5.4/daemons.c:146"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Ring of teleportation", "text": "Teleportation ring: 2% chance per turn in 3.6 (rnd(100)<2) vs 1 in 50 in 5.4 (rnd(50)==0), always cursed with aggravate monster. Teleport trap in 3.6 is silent (the local RVIP port adds the message); the original just teleports.", "source": "rogue3.6/command.c:320-325; move.c:289; rogue5.4/command.c:463"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Cursed item generation", "text": "New weapons: 10% cursed (-1..-3), 5% blessed (+1..+3). Armor: 20% cursed (+AC, worse), 8% enchanted (-AC, better). Rings: Str/protection/hit/damage rings roll 1-3 else -1 cursed; aggravate and teleportation always cursed. 5.4 same.", "source": "rogue3.6/things.c:~290-345"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Armor class goes down", "text": "Armor AC in the table: leather 8, ring mail 7, studded 7, scale 6, chain 5, splint 4, banded 4, plate 3 (smaller = better). Armor distribution: 20/15/15/13/12/10/10/5 percent. Displayed enchant is a_class - o_ac.", "source": "rogue3.6/init.c:343-366; rogue5.4/extern.c:arm_info"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Haste self exhaustion", "text": "Drinking haste while hasted (5.4): \"you faint from exhaustion\" and you lose haste plus rnd(8) turns of helplessness. 3.6 same message in misc.c.", "source": "rogue5.4/misc.c:385-395; rogue3.6/misc.c:329"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Wand of polymorph", "text": "Polymorph turns the target into any of 26 letters rnd(26)+'A', including a dragon or purple worm; stats are reset. Wand of drain life takes half your HP spread among visible monsters in the room, and fails \"You are too weak to use it.\" below 2 HP.", "source": "rogue3.6/sticks.c:92-135"}, {"game": "Rogue 5.4", "category": "oddity", "title": "Wand charges", "text": "5.4 fix_stick: light 10-19 charges, others 3-7; staves do 2x3 melee and wands 1x1.", "source": "rogue5.4/sticks.c:25-40"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Scare monster scroll on the floor", "text": "Picking up a scare monster scroll the first time marks it ISFOUND; picking it up a second time \"The scroll turns to dust as you pick it up.\" Monsters won't step on it.", "source": "rogue3.6/pack.c:81-90; chase.c:228"}, {"game": "Rogue 5.4", "category": "oddity", "title": "Treasure room", "text": "5.4 sometimes (rnd(TREAS_ROOM)==0) builds a treasure room full of items guarded by monsters from the next level down; 3.6 has no such feature.", "source": "rogue5.4/new_level.c:138-227"}, {"game": "Rogue PC", "category": "oddity", "title": "Mazes", "text": "PC adds maze rooms (Byte, Dec 1981 'How to Build a Maze' by David Matuszek) on levels 10+ with chance (level-9)/20 per gone-room. Not in 3.6/5.4.", "source": "roguepc/src/maze.c:1-5; rooms.c:53"}, {"game": "Rogue PC", "category": "oddity", "title": "Fall damage and trapdoor save", "text": "PC trapdoors/crack make you save vs luck or take 1d8 \"you are damaged by the fall\" (death 'f' fall). 3.6/5.4 trap door does no damage.", "source": "roguepc/src/move.c:313-316"}, {"game": "Rogue PC", "category": "oddity", "title": "Eating when stuffed", "text": "PC: eating when food_left > STOMACHSIZE-20 puts you to sleep for 2+rnd(5): \"You feel bloated and fall asleep\".", "source": "roguepc/src/misc.c:283-303"}, {"game": "Rogue PC", "category": "oddity", "title": "40-column hunger", "text": "PC in 40 column terse mode burns food twice as fast ('pretty gross huh?').", "source": "roguepc/src/daemons.c:149-158"}, {"game": "Rogue PC", "category": "oddity", "title": "Level 1 gentleness", "text": "In Rogue PC any hit against the hero is halved on dungeon level 1 (max_level==1: damage=(damage+1)/2) 'special goodies for the commercial version'.", "source": "roguepc/src/fight.c:399-405"}, {"game": "Rogue PC", "category": "combat", "title": "Copy protection damage multiplier", "text": "Rogue PC's floppy copy protection set hit_mul = P_DAMAGE (6): if the disk check failed, every hit against you deals 6x damage and the tombstone reads your name as \"Software Pirate\" killed by \"Copy Protection Mafia\". A valid disk sets hit_mul=1 and shows your real name/killer.", "source": "roguepc/src/rogue.h:19-22; extern.c:368-371; mach_dep.c:461-470; fight.c:408-410"}, {"game": "Rogue (all)", "category": "combat", "title": "Monster stats comparison: dragon", "text": "Dragon XP: 9000 (3.6), 5000 (5.4), 6800 (PC); all share level 10, AC -1, 1d8/1d8/3d10 damage. Jabberwock/purple worm: 7000 vs 3000 vs 4000; troll 55 vs 120.", "source": "rogue3.6/init.c:81; rogue5.4/extern.c:196; roguepc/src/extern.c:430"}, {"game": "Rogue 3.6", "category": "combat", "title": "Vampire in 3.6", "text": "3.6 vampire (V) is plain 1d10 with regeneration; no level or HP drain. 5.4 vampires drain max HP 30% of hits (1d3); PC 1d5.", "source": "rogue3.6/fight.c:174; rogue5.4/fight.c:229-257"}, {"game": "Rogue 3.6", "category": "unique", "title": "Amulet of Yendor placement", "text": "In 3.6 the Amulet is dropped on a floor only on levels deeper than 25 (level > 25) when you don't yet carry it; 5.4 uses level >= AMULETLEVEL (26). Mimics created below level 25 can also disguise as the Amulet ('rnd(9)' case 8).", "source": "rogue3.6/newlevel.c:157; monsters.c:78-94; rogue5.4/new_level.c:163"}, {"game": "Rogue 3.6", "category": "unique", "title": "Monster order strings", "text": "3.6 depth string: \"KJBSHEAOZGLCRQNYTWFIXUMVDP\" (kobold ... purple worm). Wanderers use \"KJBSH AOZG CRQ Y W IXU V  \", skipping E, L, N, T, F, M, D, P. Depth d = level + rnd(10) - 5. 5.4 string is K E B S H I R O Z L C Q A N Y F T W P X U M V G J D with I, L, N, F, X, D excluded from wanderers (level + rnd(10) - 6).", "source": "rogue3.6/monsters.c:19-45; rogue5.4/monsters.c:21-45"}, {"game": "Rogue PC", "category": "unique", "title": "Slime splits", "text": "Rogue PC adds the slime (S, 1d3, AC 8, 1 xp). When you miss it, 75% of the time it divides (\"The slime divides.  Ick!\"); slime.c is dated 1/17/85, A.I. Design 1.42. Slimes far away (dist > 3) move at slow speed.", "source": "roguepc/src/slime.c:1-30; fight.c:~96; chase.c:27; extern.c:447"}, {"game": "Rogue PC", "category": "unique", "title": "Ur-vile and kestral", "text": "PC has an ur-vile (xorn's place: 1d3/1d3/1d3/4d6, AC -2, 190 xp) and spells it 'kestral' (5.4: kestrel). Its ice monster hit lowers your helplessness (\"When an Ice Monster hits you, you get unfrozen faster\"); its freeze comes from a wand of cold blast: \"You are frozen by a blast of frost from the Ice Monster\".", "source": "roguepc/src/extern.c:437-449; fight.c:~126; sticks.c:428"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Hit chance formula", "text": "3.6 hit if rnd(20)+1 + hit bonus >= (21 - attacker level) - defender armor class. Armor class 10 is bare; lower AC is better. 5.4 and PC compute rnd(20) vs (20 - level) - armor, which is identical.", "source": "rogue3.6/fight.c:308-316; rogue5.4/fight.c:380-385"}, {"game": "Rogue 5.4", "category": "oddity", "title": "5.4 strength tables", "text": "5.4 uses lookup tables by raw strength: str_plus 7-16 = 0, 17-20 = +1, 21-30 = +2, 31 = +3; add_dam 16-17 = +1, 18 = +2, 19-20 = +3, 21 = +4, 22-30 = +5, 31 = +6; below 7 both give str-7.", "source": "rogue5.4/fight.c:44-58"}, {"game": "Rogue 5.4", "category": "unique", "title": "Flying and hasted monsters", "text": "5.4 flying monsters (bat, griffin, kestrel) get a second move when 3+ squares from you. Hasted monsters also move twice; slowed ones (ISSLOW) move every other turn. 3.6's runners() gives hasted monsters a second do_chase and slowed ones alternate turns via t_turn.", "source": "rogue5.4/chase.c:36-70; rogue3.6/chase.c:26-40"}, {"game": "Rogue 3.6", "category": "unique", "title": "Starting kit", "text": "3.6/5.4 start: ring mail +1 (base armor class 7, so 6 shown), a +1,+1 mace, a +1 bow, 25-39 arrows (rnd(15)+25 in 5.4, 25+rnd(15) in 3.6) and one food ration. 5.4 wields the mace.", "source": "rogue3.6/main.c:168-222; rogue5.4/init.c:31-76"}, {"game": "Rogue 3.6", "category": "combat", "title": "Leprechaun gold", "text": "Leprechaun steals GOLDCALC (rnd(50+10*level)+2) gold, and 4 more portions if you fail a magic save, then vanishes. Killing one adds GOLDCALC to the room's gold (+4 more if the save succeeds).", "source": "rogue3.6/fight.c:207-218,697-713"}, {"game": "Rogue 3.6", "category": "combat", "title": "Wand of fire, lightning, cold", "text": "The three bolt wands do 6d6; the same bolt bounces off walls (BOLT_LENGTH 6) and can hit you. A dragon shrugs off flame in 5.4: \"the flame bounces off the dragon\".", "source": "rogue3.6/sticks.c:246-325; rogue5.4/sticks.c:367"}, {"game": "Rogue 3.6", "category": "oddity", "title": "Search rates", "text": "3.6 search: adjacent secret door 20% per turn, hidden trap 50% per turn (finding a trap prints its name, e.g. \"a trap door\"). 5.4 uses rnd(5+probinc) for secret doors and rnd(2+probinc) for traps, and hallucination makes the displayed trap name random.", "source": "rogue3.6/command.c:388-405; rogue5.4/command.c:505-533"}, {"game": "Rogue (all)", "category": "flavour", "title": "History: Toy, Wichman, Arnold", "text": "Per Wikipedia: Michael Toy and Glenn Wichman wrote Rogue around 1980 as UC Santa Cruz students; Ken Arnold's curses library made the screen display possible; the 3x3 grid dungeon layout is the room layout. Permadeath came because players would reload saves, so the save was erased on restore.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "flavour", "title": "History: A.I. Design and Epyx", "text": "Toy, Wichman and Jon Lane founded A.I. Design for commercial ports; Epyx financed ports (Macintosh, Amiga, PC) around 1984. They sold well at first then declined; Wikipedia calls it a commercial flop. 4.2BSD (1983) spread Rogue across ARPANET colleges.", "source": "https://en.wikipedia.org/wiki/Rogue_(video_game)"}, {"game": "Rogue (all)", "category": "flavour", "title": "Versions on RogueBasin", "text": "RogueBasin lists release versions 3.6.3 (Jan 2014), 5.2.1 (Mar 2005), 5.4.4 (Sep 2007) and 5.4.5 (Jun 2020); the Roguelike Restoration Project maintains source. The original Unix Rogue was influenced by D&D and Colossal Cave Adventure.", "source": "https://www.roguebasin.com/index.php/Rogue"}, {"game": "Rogue (all)", "category": "flavour", "title": "Rogue Clone by Tim Stoehr", "text": "Search summaries of MobyGames/Wikipedia credit the public domain Rogue Clone (the Unix/DOS-era clone lineage) to Timothy Stoehr; it is distinct from the Toy/Wichman/Arnold original and from the Epyx commercial ports.", "source": "https://www.mobygames.com/game/1743/rogue/"}, {"game": "Rogue PC", "category": "flavour", "title": "PC rank titles on level-up", "text": "Rogue PC shows a rank on level gain: \"and achieve the rank of \\\"%s\\\"\" using Guild Novice, Apprentice, Journeyman, Adventurer, Fighter, Warrior, Rogue, Champion, Master Rogue, Warlord, Hero, Guild Master, Dragonlord, Wizard, Rogue Geek, Rogue Addict, Schmendrick, Gunfighter, Time Waster, Bug Chaser (also shown in the status line and scoreboard).", "source": "roguepc/src/extern.c:263-285; fight.c:295; io.c:389"}, {"game": "Super-Rogue", "category": "oddity", "title": "Author is Kindelberger, not Crowl", "text": "Source credits only Robert D. Kindelberger (copyright 1984, version string '9.0 RDK 7/17/84'). No Doug Crowl anywhere in the source; RogueBasin says a group of AT&T Bell Labs employees (1982-83) made it with Kindelberger as public face.", "source": "srogue/vers.c:15; https://www.roguebasin.com/index.php/Super-Rogue"}, {"game": "Super-Rogue", "category": "oddity", "title": "Versions 6.5 to 9.0", "text": "RogueBasin lists internal/friends releases 6.5, 7.2, 8.0, 8.3 and finally 9.0, circa 5/7/83 through 7/17/84. Source was released publicly in 2004; 9.0-1 followed on 2005-03-22 from the Roguelike Restoration Project.", "source": "https://www.roguebasin.com/index.php/Super-Rogue"}, {"game": "Super-Rogue", "category": "oddity", "title": "Direct child of Rogue 3.6", "text": "Super-Rogue grew out of the Rogue 3.6 source and the copyright header still credits Toy, Arnold and Wichman. Advanced Rogue in turn took 'some additions from Super-Rogue' (RogueBasin) - a shared lineage that shows in the identical 'Friendly Fiend's Flea Market' trading-post banner in both games.", "source": "srogue/vers.c:1-12; https://www.roguebasin.com/index.php/Advanced_Rogue; srogue/trader.c:57"}, {"game": "Super-Rogue", "category": "flavour", "title": "The mission statement", "text": "The manual opens: 'You have just finished your years as a student at the local fighter's guild.' The reward for the Amulet of Yendor is 'a full membership in the local guild', and you may keep your loot; your starting weapon was 'taken from a dragon's hoard in the far off Dark Mountains'.", "source": "srogue/rogue.nr:30-60"}, {"game": "Super-Rogue", "category": "flavour", "title": "Trading post banner", "text": "Entering a trading post prints 'Welcome to Friendly Fiend's Flea Market' with the legend '$: Prices object that you stand upon.', '#: Buys the object that you stand upon.', '%: Trades in something in your pack for gold.'", "source": "srogue/trader.c:57-66"}, {"game": "Super-Rogue", "category": "unique", "title": "Trading post via a hidden trap", "text": "The post is not on the stairs: stepping on a POST-type trap calls new_level(POSTLEV). It is a single 40x10 room stocked with roll(4,10) (4-40) random items; level number does not advance.", "source": "srogue/move.c:358-362; srogue/trader.c:45-48"}, {"game": "Super-Rogue", "category": "oddity", "title": "Market closes after four deals", "text": "Only MAXPURCH=4 transactions (buy or sell) are allowed per visit; after that: 'The market is closed. The stairs are that-a-way.' (XRogue's equivalent allows Charisma/3 purchases).", "source": "srogue/rogue.h:57; srogue/trader.c:204-205; xrogue/rogue.h:72"}, {"game": "Super-Rogue", "category": "oddity", "title": "Merchant price formula", "text": "Asking price = (item worth + 50 - rnd(100), min 25) x 3, and the line printed is 'That %s is a %s for only %d pieces of gold' with the adjective random from 'great bargain', 'quality product', 'exceptional find'. The price shown is cached so repricing the same item gives the same number.", "source": "srogue/trader.c:73-97"}, {"game": "Super-Rogue", "category": "oddity", "title": "Protected items cost triple", "text": "get_worth multiplies worth by 3 for ISPROT (protected) items and by 3/2 for blessed ones; armor worth scales with (1 + 10*(base AC - current AC)).", "source": "srogue/trader.c:264-268, 197-205"}, {"game": "Super-Rogue", "category": "unique", "title": "Maze levels", "text": "A POST-like MAZETRAP sends the hero one level deeper to a full-screen maze ('You are surrounded by twisty passages!'). Mazes are always dark, hold gold worth 500+(rnd(10)+1)*GOLDCALC, and monsters there get +1 level.", "source": "srogue/move.c:365-370; srogue/trader.c:146-190; srogue/monsters.c:123-130"}, {"game": "Super-Rogue", "category": "unique", "title": "3% treasure mazes", "text": "One maze in thirty-three is a treasure maze: ISTREAS, at least 6 + level monsters; every monster there is one level tougher (treasure rooms add +1).", "source": "srogue/trader.c:307-314"}, {"game": "Super-Rogue", "category": "unique", "title": "Treasure rooms", "text": "On normal levels 3% of large rooms (30% when going back up) become dark treasure rooms full of monsters; stepping on a door of one makes every monster inside runto() the hero.", "source": "srogue/rooms.c:91-100; srogue/move.c:172-182"}, {"game": "Super-Rogue", "category": "unique", "title": "Asmodeus", "text": "The 53rd monster is 'devil Asmodeus' (A): level 40, armor -10, 500000 exp, 4d10/4d10, ISMEAN|ISREGEN. Nothing places him by normal depth rules - he is the fallback when no monster fits the level, and 'You cannot genocide Asmodeus !!'.", "source": "srogue/global.c:170; srogue/monsters.c:33,78,291"}, {"game": "Super-Rogue", "category": "flavour", "title": "Monster zoo of 52 letters", "text": "Unlike Rogue's 26, Super-Rogue has 52 monsters, one per upper and lower case letter, from giant ant to zombie and from anhkheg to zemure, with many AD&D names: bone devil, koppleganger, lonchu, quasit, vrock, xonoclon, yeenoghu, quellit, rhynosphinx.", "source": "srogue/global.c:117-170"}, {"game": "Super-Rogue", "category": "combat", "title": "Quellit and Red Dragon exp", "text": "Red dragon: 9000 exp, 1d8/1d8/3d10, armor -1. Quellit: level 17, 12500 exp, 2d10/2d6. Purple worm: 7000 exp, 2d12/2d4. The big jumps in exp make deep kills level you very fast.", "source": "srogue/global.c:121,159-163"}, {"game": "Super-Rogue", "category": "combat", "title": "Multi-attack syntax", "text": "Monster damage is a '/'-separated list, one attack each ('1d8/1d8/2d6' for the troll); roll_em loops through each, and the damage-string parser mindex() only scans the first 3 characters for 'd'.", "source": "srogue/global.c:136-170; srogue/fight.c:426-480,483-500"}, {"game": "Super-Rogue", "category": "combat", "title": "To-hit roll", "text": "swing(): roll rnd(20)+1, need = (21 - attacker level) - defender armor; hits if roll + bonuses >= need. Defender armor adds their Dexterity bonus; for the hero, armor is reduced by ring of protection.", "source": "srogue/fight.c:352-359, 441-470"}, {"game": "Super-Rogue", "category": "combat", "title": "Damage formula", "text": "damage = dplus + roll(ndice,nsides) + add_dam(attacker strength). Strength damage bonus is -1 for 3-6, 0 for 7-14, +1 for 16-17, +2 for 18, up to +5 at the top. Hunger subtracts: Weak -1, Faint -2.", "source": "srogue/fight.c:462-468; srogue/pstats.c:325-362"}, {"game": "Super-Rogue", "category": "combat", "title": "Saving throw", "text": "save_throw: need = 14 + category - (level/2) - Wisdom bonus; succeeds if d20 >= need. Used for poison, paralysis, breath, magic and petrification categories.", "source": "srogue/fight.c:550-560"}, {"game": "Super-Rogue", "category": "combat", "title": "Invincibility", "text": "Potion of invincibility ('You feel invincible.') lasts rnd(400)+350 turns: hero takes no damage from hits, sleep traps ('You feel momentarily dizzy.') and decrepedness are ignored.", "source": "srogue/potions.c:201-210; srogue/fight.c:468; srogue/move.c:392-396"}, {"game": "Super-Rogue", "category": "combat", "title": "Violet fungi counter", "text": "Each hit by a violet fungus sets ISHELD and rewrites the shared monster table damage to '%dd1' with a counter that only goes up, so every violet fungus is deadlier after each hit, even other fungi.", "source": "srogue/fight.c:200-203; srogue/global.c:123"}, {"game": "Super-Rogue", "category": "combat", "title": "Cockatrice", "text": "A cockatrice touch that fails save-vs-petrification prints 'Your body begins to solidify.' then 'You are turned to stone !!!' and kills you; the death cause is 'transmogrification to stone'.", "source": "srogue/fight.c:258-264; srogue/rip.c:370"}, {"game": "Super-Rogue", "category": "combat", "title": "Nymph steals your best item", "text": "She picks the pack item with the highest get_worth() - not random - unless it is protected: 'She stole %s!' then she vanishes. A leprechaun's touch takes GOLDCALC gold (5x if you fail a save) and also vanishes.", "source": "srogue/fight.c:216-256"}, {"game": "Super-Rogue", "category": "combat", "title": "Special touches by letter", "text": "Rust monster corrodes armor ('Your armor weakens.'), floating eye 'You are transfixed' for 25-40 turns, quasit drains Dex, giant ant sting drains Str, wraith drains a level 15% of the time, bone devil holds and poisons, imp slows, ulodyte bites to drain Str, hell hound/green dragon singe with breath.", "source": "srogue/fight.c:167-330"}, {"game": "Super-Rogue", "category": "combat", "title": "Wraith can kill outright", "text": "If a wraith's level-drain triggers when you have 0 or less exp it kills you; otherwise you lose a level and take roll(1,10) HP.", "source": "srogue/fight.c:188-199"}, {"game": "Super-Rogue", "category": "combat", "title": "Depth scaling", "text": "Past the amulet level (AMLEVEL 35) every 4 further levels give monsters +1 level; going back up the stairs adds +1 level, treasure rooms +1, mazes +1.", "source": "srogue/rogue.h:56; srogue/monsters.c:121-137"}, {"game": "Super-Rogue", "category": "oddity", "title": "Amulet stops hunger", "text": "Hunger tick is food_left -= ringfood + foodlev - amulet; with foodlev 1 and no rings, carrying the Amulet of Yendor (amulet = 1) makes you stop digesting entirely.", "source": "srogue/daemons.c:170"}, {"game": "Super-Rogue", "category": "flavour", "title": "Hunger messages", "text": "'Getting hungry.' at 300, 'You are starting to feel weak.' at 150, then at 0 faint spells ('You faint.'); at -150 'Your stomach writhes with hunger pains.' and past -350 'You starve to death !!'. Status line shows HUNGRY/STARVING/FAINTING.", "source": "srogue/daemons.c:149-185; srogue/io.c:154-159; srogue/rogue.h:244-247"}, {"game": "Super-Rogue", "category": "oddity", "title": "Volume and weight", "text": "Super-Rogue tracks both weight and pack volume (V_ constants per item type, plus per-weapon/armor volume). Enchanted armor and weapons weigh half, cursed ones +20%, blessed ones -20%, and a ring of burden adds 25%.", "source": "srogue/encumb.c:60-125"}, {"game": "Super-Rogue", "category": "unique", "title": "Items can be blessed or cursed", "text": "Almost everything carries ISBLESS/ISCURSED, and potions, scrolls and sticks change behaviour: e.g. a blessed wand of anti-matter has blast radius 0, normal 1, cursed 2; many cursed potions simply do nothing.", "source": "srogue/sticks.c:475-492; srogue/potions.c:35-48"}, {"game": "Super-Rogue", "category": "unique", "title": "Scroll list", "text": "26 scroll types incl. item knowledge, item protection, demons curse, transport, enchantment, gods blessing, aquirement (sic), banishment, recharge wand, locate traps, genocide, blank paper.", "source": "srogue/global.c:318-345"}, {"game": "Super-Rogue", "category": "flavour", "title": "Scroll banishment", "text": "Banishment sends you level+10+rnd(20) deep ('You are banished to the lower regions.'); a blessed one, if you are below level 6, instead lifts you to level 1-5 ('elevated to the upper regions'). 'You are whisked away to another region.' for transport.", "source": "srogue/scrolls.c:392-410, 296-308"}, {"game": "Super-Rogue", "category": "flavour", "title": "Scare monster read in vain", "text": "Reading scare monster is a mistake: 'You hear maniacal laughter in the distance.' (it should be dropped).", "source": "srogue/scrolls.c:247-252"}, {"game": "Super-Rogue", "category": "flavour", "title": "Scroll of create monster failure", "text": "If it fails: 'You hear a faint cry of anguish in the distance.'", "source": "srogue/scrolls.c:133-139"}, {"game": "Super-Rogue", "category": "flavour", "title": "Potion messages", "text": "Blindness: 'A cloak of darkness falls around you.' Etherealness: 'You feel more vaporous.' Increase wisdom: 'You feel more perceptive.' Nothing: 'This potion tastes extremely dull.' See invisible: 'This potion tastes like %s juice.' (your fruit).", "source": "srogue/potions.c:163,235,248,257"}, {"game": "Super-Rogue", "category": "unique", "title": "Potions of the strange", "text": "21 potions include etherealness (walk through walls), thirst quenching, decrepedness (-1 to -3 all abilities), super ability and invincibility (3-4 frequency each).", "source": "srogue/global.c:355-380"}, {"game": "Super-Rogue", "category": "unique", "title": "Wand of anti-matter, clone, pyromania", "text": "Sticks include 'pyromania' (explodes: 'The rod explodes !!!' for 6d6 damage and is destroyed), 'clone monster', 'annihilate monster', 'sap life' (halves your HP) and 'food absorption' (food_left /= 3 and eats pack food).", "source": "srogue/global.c:394-420; srogue/sticks.c:102-136"}, {"game": "Super-Rogue", "category": "unique", "title": "Rings", "text": "Rings include 'ogre strength', 'lethargy', 'burden', 'illumination', 'fire protection', 'delusion', 'sustain ability', 'digestion', 'teleportation' and 'aggravate monster'.", "source": "srogue/global.c:384-411"}, {"game": "Super-Rogue", "category": "flavour", "title": "Death by trap", "text": "Tombstone causes: 'crooked arrow', 'sharp dart', 'jagged bolt', 'magic pool', 'exploding rod', 'burning scroll', 'transmogrification to stone'.", "source": "srogue/rip.c:364-371"}, {"game": "Super-Rogue", "category": "unique", "title": "Magic pool", "text": "Standing in a pool, D dips an item: 'The pool bubbles for a moment.' for nothing; the pool can enchant, teleport you ('You find yourself in strange surroundings.'), drop you a level, or 6% drown you: 'Oh no!!! You drown in the pool!!!'", "source": "srogue/move.c:495-515, 520-690"}, {"game": "XRogue", "category": "oddity", "title": "Author: Pietkivitch, not Morgan", "text": "Copyright 1991 Robert Pietkivitch, 'Based on Advanced Rogue' (Morgan, Dalka, AT&T 1984-85) 'Based on Rogue' (Toy, Arnold, Wichman). RogueBasin: derived from Advanced Rogue 7.7 for the AT&T UNIX PC; 'Tom Morgan' and 'Rogue Plus' do not appear in the source. Version string: 8.0.3 - 12/10/2005.", "source": "xrogue/vers.c:3-20; https://www.roguebasin.com/index.php/XRogue"}, {"game": "XRogue", "category": "oddity", "title": "Death of the maintainer", "text": "Pietkivitch died in a car accident on 2002-12-03, leaving unfinished changes whose source was lost; the Restoration Project released 8.0.3 in 2005 and the Roguelike Gallery took over in 2015.", "source": "https://www.roguebasin.com/index.php/XRogue; https://rlgallery.org/about/xrogue.html"}, {"game": "XRogue", "category": "oddity", "title": "211 monsters", "text": "NUMMONST is 211. The README bills it as 'over 200 monsters'; Rogue had 26.", "source": "xrogue/rogue.h:64; xrogue/README.TXT:50"}, {"game": "XRogue", "category": "unique", "title": "Nine character classes", "text": "Fighter, Paladin, Ranger, Magic-User, Cleric, Thief, Assassin, Druid, Monk. Rangers and Paladins refuse to attack monsters that have not attacked first; killing too many makes the Paladin a mere Fighter.", "source": "xrogue/README.TXT:78-165"}, {"game": "XRogue", "category": "unique", "title": "Class quest items", "text": "Fighter: Axe of Aklad; Ranger: Mandolin of Brian; Paladin: Ankh of Heil; Cleric: Horn of Geryon; Magician: Stonebones Amulet; Thief: Musty Daggers; Assassin: Eye of Vecna; Druid: Quill of Nagrom; Monk: Emori Cloak.", "source": "xrogue/README.TXT:633-643"}, {"game": "XRogue", "category": "oddity", "title": "75 attribute points", "text": "You start with 75 points to distribute; Backspace goes back, ESC auto-assigns max. Stats cap at 50 normally.", "source": "xrogue/README.TXT:170-180"}, {"game": "XRogue", "category": "flavour", "title": "'Metabolically challenged'", "text": "The manual's euphemism for death: 'If the player's current hit points reach 0, the player becomes metabolically challenged.'", "source": "xrogue/README.TXT:274"}, {"game": "XRogue", "category": "oddity", "title": "Fortune command that is not a fortune", "text": "The '+' key prints one of ~18 sayings only on rolls 0,5,10..85 and 95: 'An oak tree in the garden.', 'Character is what you become in the dark.', 'You are inside a computer.', 'Charon (the Boatman) awaits you...'. Other rolls print nothing. The ? help for '+' says 'Meaningless command' and the comment is 'instant karma!'.", "source": "xrogue/command.c:435-455; xrogue/help.c:242,516-518"}, {"game": "XRogue", "category": "unique", "title": "17 artifacts (relics)", "text": "Daggers of Musty Doit, Cloak of Emori, Ankh of Heil, Staff of Ming, Wand of Orcus, Rod of Asmodeus, Amulet of Yendor, Mandolin of Brian, Horn of Geryon, Morning Star of Hruggek, Flail of Yeenoghu, Eye of Vecna, Axe of Aklad, Quill of Nagrom, Amulet of Stonebones, Ring of Surtur, Card of Alteran - each carried by a unique monster at depths 40-50.", "source": "xrogue/rogue.c:387-405; xrogue/README.TXT:700-720"}, {"game": "XRogue", "category": "unique", "title": "Artifacts are sentient", "text": "The README warns they 'have intelligence and some will reject mishandling'; they eat food and some 'kill you immediately if you happen to pick them up while wielding another weapon'.", "source": "xrogue/README.TXT:491-500"}, {"game": "XRogue", "category": "flavour", "title": "Artifact insists on being wielded", "text": "'The artifact insists you release your current weapon!' / 'The artifact forces your weapon into your heart!' / 'It hums with satisfaction!'", "source": "xrogue/pack.c:378-385"}, {"game": "XRogue", "category": "flavour", "title": "Ring of Surtur", "text": "'The ring forces itself through your nose!' (you gain a sense of smell) then 'The pain slowly subsides.. '", "source": "xrogue/pack.c:390-402"}, {"game": "XRogue", "category": "flavour", "title": "Instruments", "text": "Mandolin: 'You hear an ancient haunting sound... ' 'You are transfixed with empathy.' Horn of Geryon: 'You begin to hear trumpets!' 'You follow their calling.' Each can change you to the matching class after a fuse.", "source": "xrogue/pack.c:402-420"}, {"game": "XRogue", "category": "unique", "title": "Gold-eating artifacts", "text": "Musty Doit's Daggers and the Axe of Aklad start an eat_gold daemon: one coin per turn. 'Bids you to find some more gold.' at 250, 'Demands...' at 100, 'Commands...!!' at 50, and at 0 gold 'You feel the artifact gnawing away...' costing HP until you die: 'an artifact's wrath'.", "source": "xrogue/pack.c:354-362; xrogue/daemons.c:666-690"}, {"game": "XRogue", "category": "unique", "title": "Eye of Vecna", "text": "A constant 1 HP drain per turn: 'You feel Vecna's eye looking about.' at 50 and 25 HP, 'Vecna's eye moves about very quickly.' at 10-3, and 'Vecna's curse is upon you!'", "source": "xrogue/command.c:596-612"}, {"game": "XRogue", "category": "unique", "title": "Card of Alteran", "text": "Cannot be picked up: give a slime-mold (g command) to the unique 'ipsissimus (Alteran)'. He says 'gives you a strange rectangular card' then 'bids you farewell' and is removed. Taking it otherwise kills you ('the face of death'): 'You look at the dark card and it chills you to the bone!!'", "source": "xrogue/player.c:431-495; xrogue/pack.c:423-430; xrogue/rogue.c:205"}, {"game": "XRogue", "category": "unique", "title": "Slime-mold diplomacy", "text": "Giving a slime-mold to a friendly non-unique monster gives you a food ration in return ('gives you food in return and nods off to sleep'); quartermasters merely laugh; non-mean uniques (dragons) are 'set free by your generosity'.", "source": "xrogue/player.c:470-492"}, {"game": "XRogue", "category": "unique", "title": "Quartermaster", "text": "Wandering vendor 'q': level 7, 1000 exp, armor -6, 8d10, CANSELL|CANINWALL|NOFEAR. Wares are never cursed, often blessed, and he sells then vanishes. Hit him and 'disappears with his wares in a flash!'.", "source": "xrogue/mons_def.c:1651-1658; xrogue/fight.c:194-198; xrogue/README.TXT:491"}, {"game": "XRogue", "category": "unique", "title": "Equipage at start", "text": "Game begins in 'Friendly Fiend's Equipage' (trading post) with class-dependent gold from a base 3000, later 'Friendly Fiend's Flea Market'; the post is entered with '>' like stairs. Wizards get 50000 gold.", "source": "xrogue/trader.c:332-338; xrogue/init.c:288-296,393"}, {"game": "XRogue", "category": "unique", "title": "Unique monsters", "text": "Once a unique is killed no other is generated. Roster includes Jacaranda, Hruggek, Surtur, Yeenoghu, Orcus, Geryon, Asmodeus, Brian, Emori, Aklad, Heil, Nagrom, Tsoming Zen, Musty Doit, Yendor, Stonebones, Vecna, Thrym, Kurtulmak, Antar, Jubilex, Bone, Graz'zt, Demogorgon, Mammon, Baalzebul, Moloch, Dispater, Bahamut, Tiamat, Maglubiyet, Gruumsh, Cambion, Dretch, Nabassu, Baphomet, Hutijin, Glasya, Titivilus, Alteran and Charon.", "source": "xrogue/mons_def.c:260-1500"}, {"game": "XRogue", "category": "unique", "title": "Charon the Boatman", "text": "Last unique: 'boatman (Charon)', level 18, 250000 exp, armor -20, 10d8+200 HP, 12d12/12d12, summons an 'ancient saphire dragon' (sic). The fortune says he awaits you.", "source": "xrogue/mons_def.c:1422; xrogue/command.c:457"}, {"game": "XRogue", "category": "unique", "title": "Daemons that turn you to stone", "text": "Lesser/greater daemons (Pisco, Dergho, Ultro, Hydro, Yagno, Arcana) carry TOUCHSTONE; Ravana, Azazel, Putana etc. carry LOOKSTONE (gaze); both are 140000/120000-exp uniques.", "source": "xrogue/mons_def.c:1300-1420"}, {"game": "XRogue", "category": "combat", "title": "Per-class to-hit table", "text": "swing(): need = base - factor*((min(level,max_lvl)-offset)/range) + (10 - armor). Fighters scale to level 30 (range 3), Rangers/Paladins 22-23, magicians/clerics 24, Thieves 28, Assassins 26, Monks 25 (range 2). A need of 21-25 is clamped to 20, so a natural 20 always hits.", "source": "xrogue/fight.c:308-323; xrogue/rogue.c:145-157"}, {"game": "XRogue", "category": "combat", "title": "Damage details", "text": "damage = dplus + roll + strength bonus. Monks get no strength bonus and unarmed damage (lvl/3+2)d4; with a weapon +lvl/2. Metal weapons 'pass right through' NOMETAL monsters. Cloak of displacement can nullify the first hit.", "source": "xrogue/fight.c:355-363, 640-676, 172-176"}, {"game": "XRogue", "category": "combat", "title": "Backstab multiplier", "text": "Thieves and Assassins hitting a sleeping, held or frozen foe that lacks NOSTAB get a stab: damage x (2 + (level-1)/4), capped at x5, +1 with the Musty Daggers (artifact); a stab also adds +4 to hit.", "source": "xrogue/fight.c:129-140, 676-690, 501"}, {"game": "XRogue", "category": "combat", "title": "Assassination", "text": "Assassin chance = 50 + 5*(level - victim level)%, +20 with a poisoned weapon, and never on uniques; if it works damage = victim HP + 1. 'You have assassinated' vs 'backstabbed' messages.", "source": "xrogue/fight.c:140-152, 800-812"}, {"game": "XRogue", "category": "combat", "title": "Poisoned weapons", "text": "An assassin's poisoned blade (ISPOISON) is used up on the next hit: +1/4 victim HP if they save, +1/2 if not.", "source": "xrogue/fight.c:694-702"}, {"game": "XRogue", "category": "combat", "title": "Magic-only monsters", "text": "MAGICHIT / BMAGICHIT / CMAGICHIT monsters need a weapon of at least +1 / +2 / +3 (hit or damage); artifacts always count. Monks gain the ability at levels 5/10/15.", "source": "xrogue/fight.c:35-52"}, {"game": "XRogue", "category": "combat", "title": "Speed and actions", "text": "movement() returns time per step: armor class bonus, pack over 75% of capacity +1, dexterity bonus subtracts, plus monster base movement; slowed or dancing x2, hasted /2. Actions take time and can be disrupted: casters lose spells if hit, you 'might choke' if hit while eating.", "source": "xrogue/move.c:1469-1520; xrogue/README.TXT:355-365"}, {"game": "XRogue", "category": "combat", "title": "Artifact weapon damage", "text": "Hard-coded: Musty Daggers 4d8/4d8 (+2 each for Thieves), Flail of Yeenoghu 4d8+3 with paralyze/confuse, Hruggek's Morning Star 4d8+3, Axe of Aklad 4d8+2 (+4 thrown, +2 more for Fighters) draining, Staff of Ming 4d8+4, Rod of Asmodeus 4d8/4d8, Wand of Orcus 4d8 'destroy'.", "source": "xrogue/fight.c:355-392"}, {"game": "XRogue", "category": "combat", "title": "Heil's Ankh maxes damage", "text": "Any hit by a hero holding the Ankh does ndice*nsides, always maximum.", "source": "xrogue/fight.c:645-650"}, {"game": "XRogue", "category": "combat", "title": "Orcus Wand backlash", "text": "Each time it destroys a monster (that fails a save) you lose (HP/5)+1 hit points; fail a save and 'The wand devours your soul!' and you die. Messages: 'You feel a tug at your life force.', 'The artifact draws some energy.'", "source": "xrogue/fight.c:602-640"}, {"game": "XRogue", "category": "combat", "title": "Aklad Axe thrown by monsters", "text": "Monsters with ranged tactics prefer to throw your Axe of Aklad if they have it - the all-powerful weapon ranks above crossbow bolts.", "source": "xrogue/chase.c:830-855"}, {"game": "XRogue", "category": "unique", "title": "Spells, prayers, chants", "text": "Magic-Users have 16 spells (table thresholds 3 to 70: identify 5, remove curse 10, fly 20, sleep 30, haste 60, hold 70); Clerics 16 prayers (thresholds: healing 25, restore 35, map 40, enchant 70); Druids 16 chants (charm monster 65, hold 70) - all built from existing potions, scrolls and wands via a table.", "source": "xrogue/rogue.c:440-507"}, {"game": "XRogue", "category": "unique", "title": "Quill of Nagrom scrolls", "text": "The Quill writes 14 kinds of scroll for energy 5 to 100: gold find, identify, light, remove curse, map, confuse, sleep, curing, teleport, scare, hold, petrify, protect, enchant.", "source": "xrogue/rogue.c:509-525; xrogue/misc.c:667"}, {"game": "XRogue", "category": "unique", "title": "Miscellaneous magic", "text": "23 misc items: alchemy jug, beaker of potions, book of spells, boots of elvenkind, bracers of defense, chime of opening/hunger, cloaks, drums of panic, dusts of disappearance/choking, gauntlets of dexterity/ogre power/fumbling, jewel of attacks, Keoghtom's ointment, robe of powerlessness, necklace of adaptation/strangulation, boots of dancing, book of skills, medicine crystal.", "source": "xrogue/rogue.c:361-385"}, {"game": "XRogue", "category": "flavour", "title": "Dust of choking", "text": "'aaAAACHOOOooo. Cough. Cough. Sneeze. Sneeze.' then 'You choke to death!!!' on a failed poison save (immune with Surtur's ring); the disappearing dust gives 'Ahh.. Ahh... Choo!!'", "source": "xrogue/misc.c:1027-1055"}, {"game": "XRogue", "category": "flavour", "title": "Medicine crystal", "text": "'You rub the crystal and it vibrates softly...' cures you and turns your fingertips blue; a cursed crystal 'has absorbed you...' (death 'being absorbed').", "source": "xrogue/misc.c:1130-1150"}, {"game": "XRogue", "category": "flavour", "title": "Death causes", "text": "Includes 'an artifact's wrath', 'being absorbed', 'dust of choking', 'being too frightened', 'choking on food', 'poor health', 'being too weak', 'the face of death', 'a bug'.", "source": "xrogue/rogue.c:185-206"}, {"game": "XRogue", "category": "flavour", "title": "Dropped into a pool", "text": "'Gloop... Your %s sinks out of sight.'", "source": "xrogue/things.c:449"}, {"game": "XRogue", "category": "oddity", "title": "Relics eat food", "text": "Each worn artifact adds one extra food point per turn; rings add their own, minimum 1. Stomach 2100, hungry below 160 (2*MORETIME), weak below 80.", "source": "xrogue/daemons.c:343-367; xrogue/rogue.h:402-403"}, {"game": "XRogue", "category": "oddity", "title": "Fainting is random death", "text": "When food <= 0 you faint 12% of ticks; if already fainting, rnd(28)==7 (1 in 28) and you simply 'You starve to death!!'.", "source": "xrogue/daemons.c:327-340"}, {"game": "XRogue", "category": "oddity", "title": "Spell recovery depends on stats", "text": "Energy returns every SPELLTIME - max(17-Int,0) turns (min 5); prayer and chant recovery use Wisdom the same way.", "source": "xrogue/daemons.c:699-730"}, {"game": "XRogue", "category": "unique", "title": "Outer region and wormholes", "text": "Going up from level 1 before getting your quest item enters the dinosaur-filled outer region (brontosaurus 900 exp 6d8; sauropod summons grigs); a wormhole trap sends you there while keeping the dungeon level.", "source": "xrogue/README.TXT:645-660; xrogue/mons_def.c:1551-1569"}, {"game": "XRogue", "category": "unique", "title": "Charm monster", "text": "Reading charm monster makes a few monsters follow you downstairs if they are in the room; hitting a charmed monster gives it a save ('The eyes of %s turn clear.').", "source": "xrogue/README.TXT:705-715; xrogue/fight.c:202"}, {"game": "XRogue", "category": "oddity", "title": "Thieves detect, Monks dodge", "text": "Thieves sense gold (G) and traps (X) and can set traps (^); Monks wear no armor and their AC improves with level; only Rangers/Paladins/Monks gain 'special' skills after a few levels.", "source": "xrogue/README.TXT:120-165, 636-650"}, {"game": "MAG", "category": "flavour", "title": "Victory screen and the hidden word", "text": "Escaping with the Sapphire prints \"You have retrieved the sacred Sudbury Sapphire from its deep prison!\" and then reveals that \"deep within the scintillating gemstone can be seen a single word\". That word is the wizard-mode password, rebuilt at runtime from a table of chars offset by '^'.", "source": "/Users/felix/Games/mag/src/MISC.C:55-90; src/WIZARD.C:15-16"}, {"game": "MAG", "category": "flavour", "title": "Failure ending", "text": "Leaving by the surface without the gem prints \"However, you have failed your quest for the Sudbury Sapphire.\"", "source": "/Users/felix/Games/mag/src/MISC.C:87"}, {"game": "MAG", "category": "flavour", "title": "Wizard welcome", "text": "Entering the correct wizard password prints \"You feel as smart as Michael J. Teixeira -- Welcome, wizard.\" The source also keeps a decoy string, red_herring = \"tobsgcbh\", \"to throw off password seekers\".", "source": "/Users/felix/Games/mag/src/WIZARD.C:134-137"}, {"game": "MAG", "category": "flavour", "title": "Scroll labels are mock Latin", "text": "Unidentified scrolls carry titles such as \"Semper Ubi Sub Ubi\", \"E Pluribus Unix\", \"Verbum Sapienti Est Satis\", \"Draco Te Edeat\" and the German-flavoured \"Mein Bustenhalter Uberflute\". Several are deliberately crude pseudo-Latin gags.", "source": "/Users/felix/Games/mag/src/OBJECT.H (fscrolls[])"}, {"game": "MAG", "category": "flavour", "title": "Hall of Heroes epithets", "text": "The top-five screen is titled \"- The MAG Hall Of Heroes -\" and describes each fallen hero with a random adjective from bold, brave, courageous, gallant, valiant, stouthearted, fearless, noble, honorable, e.g. \"A valiant Swordsman slain by ...\". Quitters show \"quit on level N.\"; winners \"escaped the dungeon!\".", "source": "/Users/felix/Games/mag/src/HEROES.C:15-17,110-117"}, {"game": "MAG", "category": "flavour", "title": "Twenty rank titles", "text": "Experience titles run Novice, Adventurer, Veteran, Warrior, Swordsman, Warder, Myrmidon, Hero, Swashbuckler, Protector, Defender, Champion, Superhero, Chevalier, Knight, Knight Errant, Lord, Lord Keeper, High Lord, Lord Noble.", "source": "/Users/felix/Games/mag/src/VARS.H:35-41"}, {"game": "MAG", "category": "flavour", "title": "The author as an in-game deity", "text": "Reading a scroll of hold monster does nothing but print \"You hear Tex's maniacal laughter in the distance.\" A failed save prints \"Sorry, Tex's helpers are on strike.\"", "source": "/Users/felix/Games/mag/src/SCROLL.C:100; src/SAVE.C:162"}, {"game": "MAG", "category": "flavour", "title": "Bug-report command", "text": "The bug-logging command is compiled out: it just prints \"Sorry, this version doesn't have any bugs!\"", "source": "/Users/felix/Games/mag/src/COMMAND3.C:466-491"}, {"game": "MAG", "category": "flavour", "title": "Galvanization vision", "text": "Reading an unknown scroll of galvanization prints \"You seem to see the image of a man with red hair.\" then \"Wow!  This is a scroll of galvanization!\"", "source": "/Users/felix/Games/mag/src/SCROLL.C:194-196"}, {"game": "MAG", "category": "flavour", "title": "Thieves reject cursed loot", "text": "When a stealing monster picks a cursed item (or the Sapphire) it says \"Yucko, it's cursed!\"; one time in four it adds a lecture about \"how difficult it is to make a living in a dungeon when adventurer's not unlike yourself carry around crummy, cursed magic items.\"", "source": "/Users/felix/Games/mag/src/MATTACK.C:344-352"}, {"game": "MAG", "category": "flavour", "title": "Food reactions", "text": "Eating prints one of \"Yucko!  That was a rotten\", \"Ahh...what a delicious\", \"Yum!  That sure was a good\", \"Oh.  That sure was a wierd tasting\", \"Mmmmmm-mmmmmm.  That was a terrific\". Overeating by more than 2000 turns gives \"You ate too much and vomited!\" and leaves a pool tile.", "source": "/Users/felix/Games/mag/src/COMMAND1.C:14-20,77-84"}, {"game": "MAG", "category": "flavour", "title": "Mirror, cross and compass messages", "text": "A mirror makes a fairy flee \"by what it thinks is competition\", confuses a gorgon (\"confused by itself\"), scares a reaper (\"fears death in itself!\") and makes a will-o-wisp explode. The compass of translocation in the Sapphire level or a labyrinth says \"The needle is spinning around wildly...\"", "source": "/Users/felix/Games/mag/src/COMMAND2.C:117-144,577-579"}, {"game": "MAG", "category": "flavour", "title": "Genocide dragons", "text": "Trying to genocide the dragon symbol gives \"A crimson flash fires out of the scroll!\" and blinds you; \"any dragon is just too much for the genocide scroll\".", "source": "/Users/felix/Games/mag/src/SCROLL.C:275-280"}, {"game": "MAG", "category": "flavour", "title": "Quest framing", "text": "MAG is described as roughly between Rogue and Hack in complexity; the quest is the Sudbury Sapphire rather than the Amulet of Yendor. CRPG Addict notes the author asked $10 for the game and that the Sapphire is deep (about level 20 per the blog; the source puts it on level 25).", "source": "/Users/felix/Games/mag/README.md; http://crpgaddict.blogspot.com/2011/03/game-52-mikes-aventure-game-mag-1988.html; https://www.roguebasin.com/index.php/Mike's_Adventure_Game"}, {"game": "MAG", "category": "unique", "title": "Sudbury Sapphire level layout", "text": "Level 25 (until the gem has been seen) is three hand-defined rooms: a huge maze, a magically lit torch-lit dragon room, and a trove. Only two objects exist: a golden key and the Sapphire, both on a tile flanked by marble walls with a dragon asleep on it.", "source": "/Users/felix/Games/mag/src/LEVEL.C:21-65; src/OBJECT.C:183-188; src/MISC.C:461-464"}, {"game": "MAG", "category": "unique", "title": "Imperial Dragons", "text": "Three Imperial Dragons (hit dice 17, AC 15, attacks 1d8/2d8/9d3, 17,128 exp) guard the Sapphire level: two roam the dragon room and one sits paralysed on the gem. They are always created sleeping, and attacking or damaging the one on the gem wakes it.", "source": "/Users/felix/Games/mag/src/MONSTER.H:79-80; src/LEVEL.C:51-57; src/ATTACK.C:33-34; src/MONSTER1.C:133-138"}, {"game": "MAG", "category": "unique", "title": "Down stairs appear when you take the gem", "text": "The Sapphire level starts with only an up staircase; picking the Sapphire up creates the down staircase in the corner at dun[18][4].", "source": "/Users/felix/Games/mag/src/INVENT1.C:312-317"}, {"game": "MAG", "category": "unique", "title": "Sapphire as a charged item", "text": "The Sapphire is a limited-use item (getench() gives it rnd(3)+1, i.e. 1-3). Using it prints \"The Sapphire becomes searing hot and eminates a blinding blue light!\", fully heals you, sets off explosions around you and fires 20 random lightning bolts; afterwards \"The Sapphire cools and dims.\" With no charges: \"It sparkles briefly.\"", "source": "/Users/felix/Games/mag/src/OBJECT.C:306; src/COMMAND2.C:24-27,527-565"}, {"game": "MAG", "category": "unique", "title": "Sapphire doubles your score", "text": "Final score is multiplied by 2 if the Sapphire is in your pack; the baseline of 400 starting points is subtracted afterwards. Gems score (index+1)*123 each, keys 500 each.", "source": "/Users/felix/Games/mag/src/MISC.C:399-454"}, {"game": "MAG", "category": "unique", "title": "Thieves cannot steal the Sapphire", "text": "In steal() the check is (cursed || SAPPHIRE) so fairies, banshees and kleptums treat the gem as cursed junk. Stealers also teleport away and become frightened after a successful theft.", "source": "/Users/felix/Games/mag/src/MATTACK.C:344,366-385"}, {"game": "MAG", "category": "unique", "title": "Four coloured keys", "text": "Keys are copper, silver, golden and skeleton; each opens its own colour of magically locked trove door (\"The door is sealed with magical golden lock.\"). A skeleton key opens any, and keys are consumed: \"The key is consumed as the door swings open!\"", "source": "/Users/felix/Games/mag/src/OBJECT.H:(keys 123-126); src/DOOR.C:129-146; src/COMMAND2.C:240-245"}, {"game": "MAG", "category": "unique", "title": "Chime of opening", "text": "The chime rings \"Ding!  Ding!  Ding!\", opens any magical lock (\"Click!  The door swings open!\") or loosens a stuck door, but melts away with probability 2/3 (\"The chime melts into nothingness!\").", "source": "/Users/felix/Games/mag/src/COMMAND2.C:219-254"}, {"game": "MAG", "category": "unique", "title": "Wall torches", "text": "Rooms may have torches in the walls. They can be ignited with a tinderbox (I) or extinguished (\"The torch is now out.\"); a wand ray hitting a torch gives \"The room goes dark!\". Sleeping monsters wake more easily in torch-lit rooms (+20 to a base 5 on rnd(100)), and the Sapphire rooms are permanently torched and magic-lit.", "source": "/Users/felix/Games/mag/src/COMMAND2.C:322-358; src/COMMAND3.C:214-246; src/MONSTER1.C:102-110; src/WAND.C:532-540"}, {"game": "MAG", "category": "unique", "title": "Ring of resurrection is single use", "text": "On death a worn ring of resurrection gives \"You are still alive!\", then is destroyed, every possession is dropped where you died and you teleport away with 1 hp and AC 0. Rings of randomness only function 1 time in 20 per check.", "source": "/Users/felix/Games/mag/src/ATTACK.C:273-278,345-382; src/RING.C:189-205"}, {"game": "MAG", "category": "unique", "title": "Vial of ethereal oil and oil flasks", "text": "Lit oil flasks are on a timer of 5+rnd(50) turns: \"A burning oil flask in your pack explodes!\" The tinderbox lights things through the same utilize routine.", "source": "/Users/felix/Games/mag/src/COMMAND2.C:43-59,177; src/EVENT.C:618-645"}, {"game": "MAG", "category": "unique", "title": "Coconut armor", "text": "The armor table includes \"coconut\" at AC 5 (same as chain mail, 13608 g) while weighing only 9072 g (chain: 13608 g). Coconut, leather and padded are immune to the sulfuric cloud's acid.", "source": "/Users/felix/Games/mag/src/OBJECT.H:(armor 109-118); src/VARS.H:71-82; src/MATTACK.C:291-294"}, {"game": "MAG", "category": "unique", "title": "Boulders as weapons", "text": "A boulder weighs 30,000 g and does 3d10, but cannot be thrown until Strength reaches 21 (\"You're not strong enough to throw it!\"). Ogres and hill giants carry 1-2 boulders and hurl them at you.", "source": "/Users/felix/Games/mag/src/VARS.H:57-58,78-79; src/THROW.C:215-216; src/MONSTER2.C:205-209; src/MATTACK.C (specact)"}, {"game": "MAG", "category": "unique", "title": "Magic mushrooms", "text": "Mushrooms are never rotten and roll rnd(4): heal, +1 Strength, raise experience level, or placebo (\"It tastes like dirty fungus.\"), with cascading chances. Monsters that carry food never carry mushrooms (\"these monsters don't do drugs\").", "source": "/Users/felix/Games/mag/src/COMMAND1.C:30-66; src/MONSTER2.C:189-192"}, {"game": "MAG", "category": "unique", "title": "Fairies, kleptums, banshees steal", "text": "Fairy (1 in 7 on hit), kleptum (2 in 3 after hit) and banshee (1 in 2) steal an item and vanish: \"The kleptum phases through a wall and vanishes!\", \"The banshee cackles and vanishes!\", \"The fairy disappears in a puff of smoke!\" A ring of free action makes them \"look furious for a moment\".", "source": "/Users/felix/Games/mag/src/MATTACK.C (middleatt/afteratt/steal)"}, {"game": "MAG", "category": "unique", "title": "Monster special abilities", "text": "Reaper's scythe (1 in 5) \"slices an experience level from you\"; lich scratch paralyses 2-4 turns; polymorpher polymorphs you; transmigrant teleports you both; sulfuric cloud dissolves armor; queen snake coils (stuck); umbathri and gorgon gaze confuses; shrieker's shriek wakes the level; invisixplode detonates on contact.", "source": "/Users/felix/Games/mag/src/MATTACK.C:79-310"}, {"game": "MAG", "category": "oddity", "title": "Sapphire sits on level 25, not 20", "text": "CRPG Addict wrote that the Sapphire appears on level 20 or so; the source hard-codes sapp_lev() as dungeon level 25 and not yet visited.", "source": "/Users/felix/Games/mag/src/MISC.C:463; http://crpgaddict.blogspot.com/2011/03/game-52-mikes-aventure-game-mag-1988.html"}, {"game": "MAG", "category": "oddity", "title": "Genocide 'treat' returns a yeti", "text": "pickmon() says to return the Imperial Dragon (\"return 53; /* Imperial Dragon! */\") when you have genocided more than half the species or after 500 failed picks. Index 32 is the Imperial Dragon; index 53 is actually the yeti (zabloron is 54).", "source": "/Users/felix/Games/mag/src/MONSTER2.C:224-231; src/MAG.H:38-46"}, {"game": "MAG", "category": "oddity", "title": "Levitation dodge bonus never applies to monsters", "text": "In mattack() a levitation roll penalty is stored in 'roll' but the hit test uses a fresh rnd(20), so the intended -5 vs small monsters is dead code on monster attacks (the player's own attack version works).", "source":
