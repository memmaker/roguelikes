# Include inside the 443 server{} of /etc/nginx/sites-enabled/ruzzoli.de.conf (exact match beats ^~ /roguelikes/).
# Logs to the shared access.log (combined format, logrotate daily x14); stats.py reads it.
location = /roguelikes/beacon {
    access_log /var/log/nginx/access.log;
    add_header Cache-Control "no-store";
    return 204;
}
