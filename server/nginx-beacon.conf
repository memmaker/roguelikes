# Include inside the 443 server{} of /etc/nginx/sites-enabled/ruzzoli.de.conf (exact match beats ^~ /roguelikes/).
# Beacons also go to their own log outside /var/log/nginx, so logrotate never deletes them (wins must never be lost).
location = /roguelikes/beacon {
    access_log /var/log/nginx/access.log;
    access_log /var/lib/roguelikes-stats/beacon.log;
    add_header Cache-Control "no-store";
    return 204;
}
