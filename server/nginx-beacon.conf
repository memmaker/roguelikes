# Include inside the 443 server{} of /etc/nginx/sites-enabled/ruzzoli.de.conf (exact match beats ^~ /roguelikes/).
# Beacons also go to their own log outside /var/log/nginx, so logrotate never deletes them (wins must never be lost).
location = /roguelikes/beacon {
    # anti-spam (every win is a permanent file): 10/min per IP, bursts of 20. A 429 is not 2xx,
    # so RvipWM.report keeps it in the outbox and resends later: nothing is lost.
    limit_req zone=beacon burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/access.log;
    access_log /var/lib/roguelikes-stats/beacon.log;
    add_header Cache-Control "no-store";
    try_files /nonexistent @beacon204;   # not `return`: it runs before limit_req and would skip it
}
location @beacon204 {                    # the final location logs the request: same two logs
    access_log /var/log/nginx/access.log;
    access_log /var/lib/roguelikes-stats/beacon.log;
    add_header Cache-Control "no-store";
    return 204;
}
# data/*.json is rebuilt seconds after a beacon; the pages fetch it with cache: 'no-cache' (revalidate),
# so no nginx rule is needed (a separate location for /data/ would shadow the site's /roguelikes/ block).
